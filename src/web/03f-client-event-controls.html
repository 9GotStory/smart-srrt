<script>

  // P4-03: one explicit, revision-safe confirmation surface for privileged actions.
  let eventActionContext=null,eventActionPending=false,eventActionRequest=0;
  let ownerSavePending=false,ownerModalRequest=0,attachmentListRequest=0;
  const EVENT_ACTION_COPY={
    close:{title:'ปิดเหตุการณ์',description:'เหตุการณ์จะอ่านอย่างเดียวจนกว่าจะเปิดใหม่',button:'ยืนยันปิดเหตุการณ์'},
    reopen:{title:'เปิดเหตุการณ์อีกครั้ง',description:'เปิดให้แก้ไขเหตุการณ์และเอกสารแนบได้ตามสิทธิ์',button:'ยืนยันเปิดอีกครั้ง'},
    void:{title:'ยกเลิกเหตุการณ์',description:'ข้อมูลจะยังเก็บไว้เป็นหลักฐานตรวจสอบย้อนหลัง',button:'ยืนยันยกเลิกเหตุการณ์'},
    removeAttachment:{title:'นำเอกสารแนบออก',description:'บันทึกการนำออกเชิงตรรกะ โดยไม่ลบไฟล์จริงใน Drive',button:'ยืนยันนำออก'}
  };
  function openEventActionDialog(kind,eventId,revision,attachmentId){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับดำเนินการ');return}
    const item=allData.find(r=>r.eventId===eventId);
    const rev=Number(revision);
    if(!EVENT_ACTION_COPY[kind]||!item||!eventId||!Number.isInteger(rev)||rev<1||Number(item.revision||1)!==rev){
      toast('ข้อมูลเหตุการณ์เปลี่ยนแปลง กรุณารีเฟรชรายการก่อน');return
    }
    const closed=String(item.recordStatus||'active').toLowerCase()==='closed';
    if((kind==='close'&&closed)||(kind==='reopen'&&!closed)||
       (kind==='removeAttachment'&&(closed||!attachmentId||
          el('attachmentEventId').value!==eventId||Number(el('attachmentRevision').value||0)!==rev))){
      toast('สถานะเหตุการณ์ไม่รองรับการดำเนินการนี้');return
    }
    if(eventActionPending)return;
    const copy=EVENT_ACTION_COPY[kind];
    eventActionContext={kind,eventId,revision:rev,attachmentId:attachmentId||'',session:token,
      opener:document.activeElement};
    el('eventActionTitle').textContent=copy.title;
    el('eventActionDescription').textContent=copy.description+' — '+String(item.col6||'เหตุการณ์');
    el('eventActionConfirmBtn').textContent=copy.button;
    el('eventActionReason').value='';
    el('eventActionError').textContent='';
    el('eventActionError').hidden=true;
    openModal('eventActionModal');
    el('eventActionReason').focus()
  }
  function cancelEventAction(){
    if(eventActionPending)return;
    const opener=eventActionContext&&eventActionContext.opener;
    eventActionContext=null;
    closeModal('eventActionModal');
    if(opener&&typeof opener.focus==='function')opener.focus()
  }
  async function confirmEventAction(){
    const action=eventActionContext;
    if(!action||eventActionPending||!roleCanManage()||token!==action.session)return;
    const reason=String(el('eventActionReason').value||'').trim();
    if(!reason){
      el('eventActionError').textContent='กรุณาระบุเหตุผลก่อนยืนยัน';
      el('eventActionError').hidden=false;
      el('eventActionReason').focus();
      return
    }
    const active=allData.find(r=>r.eventId===action.eventId);
    if(!active||Number(active.revision||1)!==action.revision){
      el('eventActionError').textContent='Revision เปลี่ยนแปลงแล้ว กรุณาปิดและรีเฟรช';
      el('eventActionError').hidden=false;return
    }
    eventActionPending=true;
    const request=++eventActionRequest,confirmBtn=el('eventActionConfirmBtn'),cancelBtn=el('eventActionCancelBtn');
    confirmBtn.disabled=true;cancelBtn.disabled=true;
    try{
      let result;
      if(action.kind==='removeAttachment'){
        result=await gs('removeEventAttachment',token,action.attachmentId,reason,action.revision);
      }else{
        const fn={close:'closeEvent',reopen:'reopenEvent',void:'deleteRecord'}[action.kind];
        result=await gs(fn,token,action.eventId,reason,action.revision)
      }
      if(request!==eventActionRequest||token!==action.session||!currentUser)return;
      eventActionContext=null;
      closeModal('eventActionModal');
      if(action.kind==='removeAttachment'){
        el('attachmentRevision').value=String(result.revision||action.revision);
        toast(result.message||'นำเอกสารแนบออกแล้ว');
      }else toast(result);
      await loadDashboard();
      if(request!==eventActionRequest||token!==action.session||!currentUser)return;
      if(action.kind==='removeAttachment'&&el('attachmentEventId').value===action.eventId){
        const refreshed=allData.find(r=>r.eventId===action.eventId);
        if(refreshed)el('attachmentRevision').value=String(refreshed.revision||1);
        await loadAttachmentList()
      }
    }catch(e){
      if(request===eventActionRequest&&token===action.session&&currentUser){
        el('eventActionError').textContent=String(e.message||e);
        el('eventActionError').hidden=false
      }
    }finally{
      if(request===eventActionRequest){
        eventActionPending=false;confirmBtn.disabled=false;cancelBtn.disabled=false
      }
    }
  }
  function invalidateEventActionUi(){
    ++eventActionRequest;++ownerModalRequest;++attachmentListRequest;
    eventActionContext=null;eventActionPending=false;ownerSavePending=false;
    for(const id of ['eventActionModal','ownerModal','attachmentModal'])closeModal(id);
    for(const id of ['eventActionConfirmBtn','eventActionCancelBtn','saveOwnerBtn','uploadAttachmentBtn']){
      const control=el(id);if(control)control.disabled=false
    }
    el('eventActionReason').value='';
    el('attachmentList').innerHTML='';
    el('attachmentFile').value='';
    el('attachmentDescription').value='';
    el('ownerUserId').innerHTML='';
    for(const id of ['ownerEventContext','ownerSaveStatus','attachmentEventContext','attachmentListStatus']){
      el(id).textContent=''
    }
  }
  document.addEventListener('keydown',event=>{
    const modal=el('eventActionModal');
    if(!modal||!modal.classList.contains('open'))return;
    if(event.key==='Escape'){event.preventDefault();cancelEventAction();return}
    if(event.key!=='Tab')return;
    const focusable=[el('eventActionReason'),el('eventActionCancelBtn'),el('eventActionConfirmBtn')].filter(x=>x&&!x.disabled);
    if(!focusable.length)return;
    const index=focusable.indexOf(document.activeElement);
    if(event.shiftKey&&index<=0){event.preventDefault();focusable[focusable.length-1].focus()}
    else if(!event.shiftKey&&index===focusable.length-1){event.preventDefault();focusable[0].focus()}
  });

  function riskBadge(v){let c='status ';if((v||'').includes('สูง'))c+='st-high';else if((v||'').includes('ปานกลาง'))c+='st-mid';else c+='st-low';return`<span class="${c}">${escapeHtml(v||'-')}</span>`}
  function lifecycleBadge(r){
    const code=String(r&&r.eventLifecycle||''),label=r&&r.eventLifecycleLabel?r.eventLifecycleLabel:'-';
    let c='status ';
    if(code==='investigated'||code==='closed')c+='st-low';
    else if(code==='investigation_required'||code==='criteria_pending'||code==='verification_pending')c+='st-mid';
    else if(code==='voided'||code==='verification_rejected')c+='st-high';
    else c+='';
    return`<span class="${c}">${escapeHtml(label)}</span>`
  }
  function consistencyWarningBadge(r){
    const warnings=Array.isArray(r&&r.eventConsistencyWarnings)?r.eventConsistencyWarnings:[];
    if(!warnings.length)return'';
    const title=warnings.map(w=>w&&w.message?w.message:String(w&&w.code||'ตรวจสอบความสอดคล้อง')).join('\n');
    return` <span class="status st-mid" title="${escapeHtml(title)}"><i class="fa-solid fa-triangle-exclamation"></i> ${warnings.length}</span>`
  }
  function ownerLabel(r){
    if(!r||!r.ownerUserId)return'<span class="mini">ยังไม่กำหนด</span>';
    if(r.ownerMissing)return'<span class="status st-high">ไม่พบบัญชีผู้ใช้</span>';
    const name=r.ownerName||r.ownerEmail||r.ownerUserId;
    const detail=r.ownerOrg?`<div class="mini">${escapeHtml(r.ownerOrg)}</div>`:'';
    return`<b>${escapeHtml(name)}</b>${detail}`
  }

  async function openOwnerModal(i){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับกำหนดผู้รับผิดชอบ');return}
    const r=allData[i];if(!r||!r.eventId){toast('ไม่พบ EventID');return}
    if(String(r.recordStatus||'active').toLowerCase()==='closed'){toast('เหตุการณ์นี้ถูกปิดแล้ว กรุณาเปิดเหตุการณ์อีกครั้งก่อนเปลี่ยนผู้รับผิดชอบ');return}
    const session=token,request=++ownerModalRequest;
    el('ownerSaveStatus').textContent='กำลังตรวจสอบรายชื่อผู้รับผิดชอบ';
    try{
      const eligible=await gs('listAssignableEventOwners',token);
      if(request!==ownerModalRequest||token!==session||!roleCanManage())return;
      const current=allData.find(x=>x.eventId===r.eventId);
      if(!current||Number(current.revision||1)!==Number(r.revision||1)){toast('ข้อมูลเหตุการณ์เปลี่ยน กรุณารีเฟรช');return}
      assignableOwnerCache=eligible;
      el('ownerEventId').value=r.eventId;el('ownerRevision').value=String(r.revision||1);
      el('ownerEventContext').textContent=String(r.col6||'เหตุการณ์')+' — Revision '+String(r.revision||1);
      el('ownerUserId').innerHTML='<option value="">-- ยังไม่กำหนด --</option>'+eligible.map(u=>`<option value="${escapeHtml(u.userId)}">${escapeHtml(u.name||u.email)} — ${escapeHtml(u.role||'')}${u.org?` — ${escapeHtml(u.org)`:''}</option>`).join('');
      el('ownerUserId').value=r.ownerUserId||'';
      el('ownerSaveStatus').textContent='ตรวจสอบผู้รับผิดชอบก่อนบันทึก';
      openModal('ownerModal')
    }catch(e){if(request===ownerModalRequest&&token===session)toast(e.message||e)}
  }
  async function saveEventOwner(){
    if(ownerSavePending||!roleCanManage())return;
    const eventId=el('ownerEventId').value,revision=Number(el('ownerRevision').value||0);
    const session=token,request=ownerModalRequest,btn=el('saveOwnerBtn');
    ownerSavePending=true;
    try{
      btn.disabled=true;el('ownerSaveStatus').textContent='กำลังบันทึกผู้รับผิดชอบ';
      const msg=await gs('assignEventOwner',token,eventId,el('ownerUserId').value,revision);
      if(token!==session||request!==ownerModalRequest||!currentUser)return;
      closeModal('ownerModal');toast(msg);await loadDashboard()
    }catch(e){
      if(token===session&&request===ownerModalRequest&&currentUser){
        el('ownerSaveStatus').textContent='บันทึกไม่สำเร็จ กรุณาตรวจสอบข้อมูลและลองใหม่';
        toast(e.message||e)
      }
    }finally{
      if(request===ownerModalRequest){ownerSavePending=false;btn.disabled=false}
    }
  }

  function formatFileSize(bytes){
    const n=Number(bytes||0);
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB'
  }
  function attachmentButton(r,i){
    const count=Number(r&&r.attachmentCount||0);
    return`<button class="btn light" onclick="openAttachmentModal(${i})"><i class="fa-solid fa-paperclip"></i> ${count}</button>`
  }
  async function openAttachmentModal(i){
    if(!currentUser){openLogin();return}
    const r=allData[i];if(!r||!r.eventId){toast('ไม่พบ EventID');return}
    const closed=String(r.recordStatus||'active').toLowerCase()==='closed';
    el('attachmentEventId').value=r.eventId;
    el('attachmentRevision').value=String(r.revision||1);
    el('attachmentClosed').value=closed?'1':'0';
    el('attachmentFile').value='';
    el('attachmentDescription').value='';
    el('attachmentEventContext').textContent=String(r.col6||'เหตุการณ์')+' — Revision '+String(r.revision||1);
    el('attachmentListStatus').textContent='กำลังโหลดเอกสารแนบ';
    el('attachmentUploadPanel').style.display=roleCanRecord()&&!closed?'block':'none';
    el('attachmentReadOnlyNotice').style.display=closed?'block':'none';
    openModal('attachmentModal');
    await loadAttachmentList()
  }

  async function loadAttachmentList(){
    const eventId=el('attachmentEventId').value;
    if(!eventId||!currentUser)return;
    const session=token,request=++attachmentListRequest;
    el('attachmentListStatus').textContent='กำลังโหลดเอกสารแนบ';
    try{
      const items=await gs('listEventAttachments',token,eventId);
      if(request!==attachmentListRequest||token!==session||!currentUser||el('attachmentEventId').value!==eventId)return;
      const closed=el('attachmentClosed').value==='1';
      el('attachmentList').innerHTML=items.map(a=>{
        const remove=roleCanManage()&&!closed?`<button class="btn red" onclick='removeAttachment(${JSON.stringify(a.attachmentId||"")})'><i class="fa-solid fa-xmark" aria-hidden="true"></i> นำออก</button>`:'';
        return`<div class="content-item"><h4><i class="fa-solid fa-file" aria-hidden="true"></i> ${escapeHtml(a.fileName||'ไฟล์แนบ')}</h4><p>${escapeHtml(a.description||'ไม่มีรายละเอียด')}</p><div class="mini">${escapeHtml(formatFileSize(a.sizeBytes))} · ${escapeHtml(a.uploadedAt||'')} · ${escapeHtml(a.uploadedBy||'')}</div><div class="actions" style="justify-content:flex-start"><button class="btn secondary" onclick='downloadAttachment(${JSON.stringify(a.attachmentId||"")})'><i class="fa-solid fa-download" aria-hidden="true"></i> ดาวน์โหลด</button>${remove}</div></div>`
      }).join('')||'<div class="help">ยังไม่มีเอกสารแนบสำหรับเหตุการณ์นี้</div>';
      el('attachmentListStatus').textContent='เอกสารแนบ '+items.length+' รายการ'
    }catch(e){
      if(request===attachmentListRequest&&token===session&&currentUser){
        el('attachmentList').innerHTML='<div class="help">'+escapeHtml(e.message||e)+'</div>';
        el('attachmentListStatus').textContent='ไม่สามารถโหลดเอกสารแนบได้'
      }
    }
  }
  function attachmentMimeForFile(file){
    if(file&&file.type)return file.type;
    const name=String(file&&file.name||'').toLowerCase();
    if(name.endsWith('.pdf'))return'application/pdf';
    if(name.endsWith('.jpg')||name.endsWith('.jpeg'))return'image/jpeg';
    if(name.endsWith('.png'))return'image/png';
    if(name.endsWith('.webp'))return'image/webp';
    if(name.endsWith('.docx'))return'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    if(name.endsWith('.xlsx'))return'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    return''
  }
  function fileToBase64(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
      reader.onerror=()=>reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
      reader.readAsDataURL(file)
    })
  }
  async function uploadAttachment(){
    if(!roleCanRecord()){toast('สิทธิ์ไม่เพียงพอสำหรับแนบไฟล์');return}
    if(el('attachmentClosed').value==='1'){toast('เหตุการณ์นี้ถูกปิดแล้ว');return}
    const file=el('attachmentFile').files&&el('attachmentFile').files[0];
    if(!file){toast('กรุณาเลือกไฟล์แนบ');return}
    if(file.size>5*1024*1024){toast('ไฟล์แนบต้องมีขนาดไม่เกิน 5 MB');return}
    const btn=el('uploadAttachmentBtn');
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด';
      const base64=await fileToBase64(file);
      const result=await gs('uploadEventAttachment',token,el('attachmentEventId').value,{
        name:file.name,mimeType:attachmentMimeForFile(file),base64:base64,description:el('attachmentDescription').value
      },Number(el('attachmentRevision').value||0));
      el('attachmentRevision').value=String(result.revision||el('attachmentRevision').value);
      toast(result.message||'แนบไฟล์เรียบร้อยแล้ว');
      el('attachmentFile').value='';el('attachmentDescription').value='';
      await loadDashboard();
      const refreshed=allData.find(x=>x.eventId===el('attachmentEventId').value);
      if(refreshed)el('attachmentRevision').value=String(refreshed.revision||1);
      await loadAttachmentList()
    }catch(e){toast(e.message||e)}
    finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-upload"></i> แนบไฟล์'}
  }
  async function downloadAttachment(attachmentId){
    try{
      const result=await gs('downloadEventAttachment',token,attachmentId);
      const binary=atob(result.base64||'');
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      const blob=new Blob([bytes],{type:result.mimeType||'application/octet-stream'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=result.fileName||'attachment';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000)
    }catch(e){toast(e.message||e)}
  }
  function removeAttachment(attachmentId){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับนำเอกสารแนบออก');return}
    if(el('attachmentClosed').value==='1'){toast('เหตุการณ์นี้ถูกปิดแล้ว');return}
    openEventActionDialog('removeAttachment',el('attachmentEventId').value,Number(el('attachmentRevision').value||0),attachmentId)
  }

</script>
