<script>

  // UX-R1/P6-05: authentication UI is advisory; GS authentication/RBAC is authoritative.
  let authRequestEpoch=0,authLoginPending=false,authRegisterPending=false,authReturnFocus=null;
  function canSelfRegister(){
    return String(settings&&settings.ALLOW_SELF_REGISTER||'false').trim().toLowerCase()==='true'
  }
  function syncAuthRegistration(){
    const enabled=canSelfRegister(),button=el('authRegisterModeBtn'),form=el('authRegisterForm');
    if(button)button.hidden=!enabled;
    if(!enabled&&form&&!form.hidden)setAuthMode('login')
  }
  function setAuthStatus(id,message){
    const control=el(id);if(control)control.textContent=String(message||'')
  }
  function resetAuthFields(){
    for(const id of ['loginEmail','loginPassword','regName','regEmail','regPass','regOrg']){
      const field=el(id);if(field)field.value=''
    }
    setAuthStatus('authLoginStatus','');
    setAuthStatus('authRegisterStatus','')
  }
  function resetAuthPending(){
    authLoginPending=false;authRegisterPending=false;
    for(const id of ['authLoginSubmitBtn','authRegisterSubmitBtn']){
      const button=el(id);if(button)button.disabled=false
    }
  }
  function setAuthMode(mode){
    if(authLoginPending||authRegisterPending)return;
    const selected=mode==='register'&&canSelfRegister()?'register':'login';
    const login=el('authLoginForm'),registration=el('authRegisterForm');
    if(login)login.hidden=selected!=='login';
    if(registration)registration.hidden=selected!=='register';
    for(const [id,type] of [['authLoginModeBtn','login'],['authRegisterModeBtn','register']]){
      const button=el(id);if(button&&typeof button.setAttribute==='function')
        button.setAttribute('aria-pressed',String(type===selected))
    }
    setAuthStatus('authLoginStatus','');
    setAuthStatus('authRegisterStatus','');
    const input=el(selected==='login'?'loginEmail':'regName');
    if(input&&typeof input.focus==='function')input.focus()
  }
  function authResultCurrent(epoch,startToken,startUser){
    return epoch===authRequestEpoch&&token===startToken&&currentUser===startUser
  }
  function closeAuthDialog(){
    ++authRequestEpoch;resetAuthPending();resetAuthFields();
    closeModal('loginModal');
    const opener=authReturnFocus;authReturnFocus=null;
    if(opener&&typeof opener.focus==='function')opener.focus()
  }

  function showPage(page,btn){
    if(page==='admin'&&!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับจัดการระบบ');return}
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));el('page-'+page).classList.add('active');
    const navButtons=[...document.querySelectorAll('.nav button')];
    navButtons.forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current')});
    const selected=btn||navButtons.find(b=>b.dataset.page===page);
    if(selected){selected.classList.add('active');selected.setAttribute('aria-current','page')}
    toggleSidebar(false);
    if(page==='admin')loadAdmin();if(page==='library')renderLibrary();if(page==='records'||page==='reporter')renderTables()
  }

  function applyTheme(){
    document.documentElement.style.setProperty('--primary',settings.PRIMARY_COLOR||'#0f766e');
    document.documentElement.style.setProperty('--secondary',settings.SECONDARY_COLOR||'#2563eb');
    const logo=settings.LOGO_URL||'https://lh3.googleusercontent.com/d/1ANG8ALHZASMzdI4MFLtZHwbWcwS0vMWQ';
    el('logoImg').src=logo;el('adminLogoPreview').src=logo;
    el('appName').textContent=settings.APP_NAME||'Smart SRRT Dashboard & AI Reporter';
    el('appSubtitle').textContent=settings.APP_SUBTITLE||'ระบบบริหารจัดการข้อมูลระบาดวิทยาระดับพื้นที่';
    el('sideTitle').textContent=settings.APP_NAME||'Smart SRRT';
    el('sideOrg').textContent=settings.ORG_NAME||'District Edition';
    el('bannerText').innerHTML='<i class="fa-solid fa-bullhorn"></i> '+escapeHtml(settings.BANNER_TEXT||'ระบบพร้อมใช้งาน');
    el('closedBox').style.display=String(settings.SYSTEM_STATUS||'open')==='closed'?'block':'none'
  }

  async function boot(){
    const startToken=token,startEpoch=authRequestEpoch,startUser=currentUser;
    try{
      const b=await gs('getAppBoot',startToken);
      if(!authResultCurrent(startEpoch,startToken,startUser))return;
      settings=b.settings||{};master=b.master||{};areas=b.areas||[];currentContent=b.content||[];currentUser=b.user;
      syncAuthRegistration();applyTheme();updateAuthBox();buildRecordForm();setupDashboardFilters();
      if(currentUser)void recoverReportJob();
      await loadDashboard()
    }catch(e){if(authResultCurrent(startEpoch,startToken,startUser))toast(e.message||e)}
  }

  function updateAuthBox(){
    const box=el('authBox');
    document.querySelectorAll('.auth-only').forEach(x=>x.style.display=roleCanRecord()?'flex':'none');
    document.querySelectorAll('.manager-only').forEach(x=>x.style.display=roleCanManage()?'flex':'none');
    if(currentUser){
      box.innerHTML=`<b>${escapeHtml(currentUser.name)}</b><span>${escapeHtml(currentUser.role)} | ${escapeHtml(currentUser.email)}</span><button onclick="doLogout()">ออกจากระบบ</button>`
    }else{
      box.innerHTML='<b>ยังไม่ได้เข้าสู่ระบบ</b><span>ผู้ใช้ทั่วไปดู Dashboard สรุปได้</span><button onclick="openLogin()">เข้าสู่ระบบ</button>'
    }
    if(el('eventDetailPanel'))el('eventDetailPanel').style.display=currentUser?'block':'none';
    if(el('publicAggregateNotice'))el('publicAggregateNotice').style.display=currentUser?'none':'block';
  }

  function openLogin(){
    ++authRequestEpoch;resetAuthPending();resetAuthFields();
    authReturnFocus=typeof document!=='undefined'?document.activeElement:null;
    syncAuthRegistration();setAuthMode('login');openModal('loginModal');
    const input=el('loginEmail');if(input&&typeof input.focus==='function')input.focus()
  }
  async function doLogin(){
    if(authLoginPending||authRegisterPending||currentUser)return;
    const email=String(el('loginEmail').value||'').trim();
    const password=String(el('loginPassword').value||'');
    if(!email||!password){setAuthStatus('authLoginStatus','กรุณากรอกอีเมลและรหัสผ่าน');return}
    const startToken=token,startUser=currentUser,epoch=++authRequestEpoch;
    authLoginPending=true;el('authLoginSubmitBtn').disabled=true;
    setAuthStatus('authLoginStatus','กำลังตรวจสอบบัญชีผู้ใช้งาน');
    try{
      const r=await gs('login',{email,password});
      if(!authResultCurrent(epoch,startToken,startUser))return;
      if(!r||!r.ok||!r.token||!r.user){
        el('loginPassword').value='';
        setAuthStatus('authLoginStatus',r&&r.message||'ไม่สามารถเข้าสู่ระบบได้');
        return
      }
      token=r.token;currentUser=r.user;localStorage.setItem('SRRT_TOKEN',token);
      closeAuthDialog();updateAuthBox();toast('เข้าสู่ระบบสำเร็จ');
      void recoverReportJob();await loadDashboard()
    }catch(e){
      if(authResultCurrent(epoch,startToken,startUser)){
        el('loginPassword').value='';
        setAuthStatus('authLoginStatus',e.message||e)
      }
    }finally{
      if(epoch===authRequestEpoch){authLoginPending=false;el('authLoginSubmitBtn').disabled=false}
    }
  }
  async function doLogout(){
    // G-33/R1: invalidate the local session synchronously at logout entry so no
    // in-flight readiness, create, warning-continuation or recovery callback can
    // still pass its session guard after the user chose logout. The previous
    // token survives only inside the server-side logout RPC below.
    const logoutToken=token;
    // The G-33 isolated logout harness extracts only this function.
    // Guard optional Auth UI state while preserving synchronous invalidation in Native24.
    if(typeof authRequestEpoch!=='undefined')++authRequestEpoch;
    if(typeof resetAuthPending==='function')resetAuthPending();
    if(typeof resetAuthFields==='function')resetAuthFields();
    closeModal('loginModal');
    if(typeof authReturnFocus!=='undefined')authReturnFocus=null;
    ++reportJobCreateRequest;reportJobCreateInFlight=false;++reportWarningContinueRequest;reportWarningContinueInFlight=false;pendingReportExplicitRegeneration=false;pendingReportRegenerationConsentId='';++dashboardLoadRequest;++reportJobRecoveryRequest;++reportSummaryRequest;reportSummaryState={status:'idle',summaries:{}};reportUnknownNeedsVerification=false;reportHistoryEventId='';reportNewConfirmSubmitting=false;reportNewConfirmReturnFocus=null;closeModal('reportNewConfirmModal');el('reportNewConfirmBtn').disabled=false;el('reportNewConfirmBackBtn').disabled=false;closeModal('reportReadinessModal');hideReportCancelConfirm();stopReportPolling();activeReportJob=null;reportReadinessInFlight.clear();reportActionPreflightInFlight.clear();reportGenerationInFlight.clear();localStorage.removeItem(REPORT_JOB_LOCAL_KEY);el('reportTaskIndicator').style.display='none';++reportHistoryRequest;closeModal('reportHistoryModal');
    for(const id of ['reportHistoryEventContext','reportHistorySummary','reportHistoryWarning','reportReadinessEventContext','reportReadinessSummary','reportJobStateNote']){
      el(id).textContent='';
    }
    el('reportHistoryList').innerHTML='';
    el('reportReadinessWarnings').innerHTML='';
    token='';localStorage.removeItem('SRRT_TOKEN');currentUser=null;allData=[];dashboardSummary=null;if(typeof resetAdminWorkspace==='function')resetAdminWorkspace();if(typeof resetAdminPrivate==='function')resetAdminPrivate();if(typeof invalidateEventActionUi==='function')invalidateEventActionUi();discardRecordFormOnLogout();renderTables();
    if(typeof destroyDashboardCharts==='function')destroyDashboardCharts(true);
    updateAuthBox();if(typeof setDashboardViewState==='function')setDashboardViewState('loading');toast('ออกจากระบบแล้ว');showPage('dashboard',document.querySelector('[data-page="dashboard"]'));
    try{await gs('logout',logoutToken)}catch(e){}
    // A newer login may have started while the logout RPC was in flight; never clobber it.
    if(token)return;
    await loadDashboard()
  }
  async function register(){
    if(authRegisterPending||authLoginPending||currentUser)return;
    if(!canSelfRegister()){setAuthStatus('authRegisterStatus','ระบบปิดรับสมัครผู้ใช้ใหม่');return}
    const name=String(el('regName').value||'').trim(),email=String(el('regEmail').value||'').trim(),
      password=String(el('regPass').value||''),org=String(el('regOrg').value||'').trim();
    if(!name||!email||!password){
      setAuthStatus('authRegisterStatus','กรุณากรอกชื่อ อีเมล และรหัสผ่าน');return
    }
    const startToken=token,startUser=currentUser,epoch=++authRequestEpoch;
    authRegisterPending=true;el('authRegisterSubmitBtn').disabled=true;
    setAuthStatus('authRegisterStatus','กำลังส่งคำขอสมัครใช้งาน');
    try{
      const message=await gs('registerUser',{name,email,password,org});
      if(!authResultCurrent(epoch,startToken,startUser))return;
      el('regPass').value='';
      setAuthStatus('authRegisterStatus',String(message||'ส่งคำขอแล้ว')+' — รอผู้ดูแลระบบอนุมัติบัญชี');
    }catch(e){
      if(authResultCurrent(epoch,startToken,startUser)){
        el('regPass').value='';
        setAuthStatus('authRegisterStatus',e.message||e)
      }
    }finally{
      if(epoch===authRequestEpoch){authRegisterPending=false;el('authRegisterSubmitBtn').disabled=false}
    }
  }

</script>
