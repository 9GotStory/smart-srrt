  /**

  function createRecordsBridge(options){

          email:s.user.email,role:s.user.role};
      }catch(_){return null;}
    }

      return !!a&&!!b&&a.token===b.token&&a.user===b.user&&

        if(wasOpen&&!opened){clear();return;}
        opened=wasOpen;

      catch(_){return false;}

      if(disposed)return false;
      if(observer)invalidateDisclosure(observer.takeRecords());
      var s=current();
      if(!s||!contextValid()||(owner&&!sameSession(owner,s))){reset();return false;}
      if(!root.open){clear();return false;}
      return true;
    }
    function refresh(){
      if(!reconcile()||active)return;
      var started=epoch,origin=current();
      owner=origin;
      function valid(){
        if(observer)invalidateDisclosure(observer.takeRecords());
        if(disposed||started!==epoch)return false;
        if(!root.open||!sameSession(origin,current())||!contextValid()){
          reset();return false;
        }

          syntheticEvent:function(){return contextValid()?EVENT:null;}});

      reconcile:reconcile,dispose:dispose});
