<style>
    :root{
      --primary:#0f766e;--secondary:#2563eb;--accent:#f59e0b;--danger:#dc2626;--ok:#16a34a;
      --bg:#eef4f7;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
      --sidebar:285px;--radius:20px;--shadow:0 16px 42px rgba(15,23,42,.10)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Prompt',sans-serif;background:linear-gradient(135deg,#effaf8 0%,#f5f7fb 55%,#eef2ff 100%);color:var(--text)}
    button,input,select,textarea{font-family:'Prompt',sans-serif}
    .app{display:flex;min-height:100vh}
    .sidebar{width:var(--sidebar);background:linear-gradient(180deg,#073b3a,var(--primary) 55%,#115e59);color:#fff;padding:22px 18px;position:fixed;inset:0 auto 0 0;z-index:20;box-shadow:10px 0 30px rgba(15,23,42,.18);overflow:auto}
    .brand{display:flex;gap:12px;align-items:center;padding:8px 6px 20px;border-bottom:1px solid rgba(255,255,255,.18)}
    .brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.brand h1{font-size:17px;line-height:1.25;margin:0;font-weight:700}.brand p{margin:3px 0 0;font-size:12px;opacity:.85}
    .nav{margin-top:20px;display:grid;gap:8px}.nav button{border:0;background:transparent;color:#dff7f3;text-align:left;padding:13px 14px;border-radius:15px;cursor:pointer;font-weight:500;display:flex;gap:12px;align-items:center;font-size:14px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.16);color:#fff}.nav .auth-only,.nav .manager-only{display:none}
    .auth-card{margin-top:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:13px;font-size:12px}.auth-card b{display:block;font-size:13px}.auth-card span{display:block;word-break:break-word}.auth-card button{margin-top:9px;width:100%;border:0;border-radius:12px;padding:9px;background:#fff;color:var(--primary);font-weight:700;cursor:pointer}
    .main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));padding:24px}.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.hamb{display:none;border:0;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
    .banner{background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:var(--radius);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.banner h2{margin:0;font-size:25px;color:var(--primary)}.banner p{margin:4px 0 0;color:var(--muted)}.banner .pill{background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;padding:9px 13px;border-radius:999px;font-weight:600;white-space:nowrap}
    .section{display:none}.section.active{display:block}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(150px,1fr));margin:18px 0}.card{background:var(--card);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.kpi i{font-size:23px;color:var(--primary);background:#ccfbf1;padding:11px;border-radius:15px}.kpi .num{font-size:32px;font-weight:800;margin-top:10px;color:var(--primary)}.kpi .label{color:var(--muted);font-size:13px}
    .filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:42px}.btn{border:0;border-radius:12px;padding:10px 14px;color:#fff;background:var(--primary);font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn.secondary{background:var(--secondary)}.btn.gray{background:#64748b}.btn.orange{background:#f59e0b}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.btn.light{background:#f1f5f9;color:#0f172a;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}
    .charts{grid-template-columns:1fr 1fr}.chart{height:330px}.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;white-space:nowrap}th{background:var(--primary);color:#fff;text-align:left;padding:11px;font-size:12px}td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:12px;vertical-align:top}tr:hover td{background:#f8fafc}
    .status{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}.st-high{background:#fee2e2;color:#991b1b}.st-mid{background:#fef3c7;color:#92400e}.st-low{background:#dcfce7;color:#166534}.insight{background:linear-gradient(135deg,#fff7ed,#fffbeb);border-left:7px solid var(--accent)}
    .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.panel-head h3{margin:0;color:var(--primary);font-size:21px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fg label{display:block;font-weight:700;color:#115e59;margin-bottom:6px;font-size:13px}.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.span-3{grid-column:span 3}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
    .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;overflow:auto;padding:30px}.modal.open{display:block}.modal-box{background:#fff;max-width:1080px;margin:auto;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.25);padding:22px}.modal-sm{max-width:460px}.modal-title{font-size:21px;font-weight:800;color:var(--primary);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:90;background:#0f172a;color:#fff;padding:14px 16px;border-radius:14px;display:none;box-shadow:var(--shadow);max-width:430px}.toast.show{display:block}
    .content-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.content-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.content-item h4{margin:0 0 5px;color:var(--primary)}.content-item p{margin:0 0 10px;color:var(--muted);font-size:12px}.content-item a{color:var(--secondary);font-weight:700;text-decoration:none}
    .closed{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:16px;padding:14px;margin-bottom:14px;font-weight:700}.help{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:14px;padding:12px;font-size:12px;line-height:1.65}.logo-preview{display:flex;align-items:center;gap:14px;padding:12px;border:1px dashed var(--line);border-radius:14px;margin:10px 0}.logo-preview img{width:80px;height:80px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting-group{border:1px solid var(--line);border-radius:16px;padding:14px}.setting-group h4{margin:0 0 12px;color:var(--primary)}.mini{font-size:11px;color:var(--muted)}.progress{display:none;margin-top:10px;color:var(--primary);font-weight:700}.progress.show{display:block}
    .report-task-indicator{position:fixed;bottom:78px;right:18px;z-index:59;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--primary);box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 36px));padding:12px 15px;font-weight:700;cursor:pointer;align-items:center;gap:8px;text-align:left}
    .report-task-indicator span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .report-cancel-confirm-modal{z-index:72}
    .report-cancel-confirm-modal .modal-box{border:1px solid #fecaca}
    .report-cancel-confirm-modal .modal-title{color:#b91c1c}
    .report-cancel-confirm-modal p{margin:0 0 14px;line-height:1.7}
    .report-cancel-confirm-modal .help{margin-bottom:16px}
    .report-cancel-confirm-modal .actions{margin-top:16px}
    .report-cancel-confirm-modal button:focus-visible{outline:3px solid var(--secondary);outline-offset:3px}
    .report-cancel-error{padding:10px 12px;border:1px solid #fecaca;border-radius:12px;background:#fef2f2;color:#991b1b;font-size:12px}
    .mobile-overlay{display:none}
    @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}}
    @media(max-width:980px){.sidebar{transform:translateX(-105%);transition:.25s}.sidebar.open{transform:none}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}.main{margin-left:0;width:100%;padding:16px}.hamb{display:block}.topbar{align-items:stretch}.banner{flex-direction:column;align-items:flex-start}.charts{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span-3{grid-column:span 1}.chart{height:285px}}
    @media(max-width:560px){.kpis{grid-template-columns:1fr}.kpi .num{font-size:28px}.banner h2{font-size:21px}.modal{padding:10px}.filter .input,.filter .btn{width:100%}.panel-head{align-items:flex-start;flex-direction:column}}
  </style>
