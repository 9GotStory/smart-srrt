<script>
  google.charts.load('current', {'packages':['corechart']});
  let token=localStorage.getItem('SRRT_TOKEN')||'';
  let currentUser=null,settings={},master={},areas=[],allData=[],dashboardSummary=null,currentContent=[],usersCache=[],areaAdminCache=[],assignableOwnerCache=[],masterAdminCache=[],masterTypePolicies=[];
  const fields=[
    [2,'วันรับแจ้ง','date'],[9,'วันที่เริ่มป่วย','date'],[3,'ผู้แจ้งข่าว/หน่วยงานที่แจ้ง','text'],
    [4,'การเฝ้าระวัง','select:surveillance'],[5,'กลุ่มโรค','select:disease_group'],[6,'โรค/ภัย/เหตุการณ์','text'],
    [7,'ประเภทเหตุการณ์','select:event_type'],[8,'สถานที่เกิดเหตุ','text'],
    [13,'จังหวัด','area:province'],[12,'อำเภอ','area:amphoe'],[11,'ตำบล','area:tambon'],[10,'หมู่ที่','area:moo'],
    [29,'ชื่อหมู่บ้าน','area:village'],[30,'รหัสหมู่บ้าน','text'],
    [14,'รายละเอียดเหตุการณ์','textarea'],[15,'การตรวจสอบ','select:verify_status'],[16,'วิธีการตรวจสอบ','text'],
    [17,'เข้าเกณฑ์สอบสวนโรค','select:criteria'],[18,'ประเภทการสอบสวนโรค','text'],
    [24,'ลงสอบสวนโรค','select_custom:ลงสอบสวน|ไม่ลงสอบสวน'],[26,'วันที่ลงสอบสวนโรค','date'],
    [19,'ประเมินความเสี่ยงแจ้งเตือน','select:risk'],[20,'หน่วยงานแจ้งเตือน','text'],[23,'หน่วยงานรับแจ้ง','text'],
    [21,'การดำเนินการตามมาตรการ','textarea'],[22,'วันที่ดำเนินการตามมาตรการ','date']
  ];
  const settingFields=['APP_NAME','APP_SUBTITLE','ORG_NAME','CONTACT_INFO','BANNER_TEXT','PRIMARY_COLOR','SECONDARY_COLOR','SYSTEM_STATUS','ALLOW_SELF_REGISTER','GEMINI_API_KEY','GEMINI_MODEL','TEMPLATE_DOC_ID','REPORT_FOLDER_ID'];

  function el(id){return document.getElementById(id)}
  function gs(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(err))[fn](...args))}
  function toast(msg){const t=el('toast');t.textContent=String(msg||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4200)}
  function openModal(id){el(id).classList.add('open')} function closeModal(id){el(id).classList.remove('open')}
  function toggleSidebar(show){el('sidebar').classList.toggle('open',show);el('overlay').classList.toggle('show',show)}
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function unique(arr){return [...new Set(arr.filter(v=>String(v||'').trim()!=='').map(v=>String(v).trim()))].sort((a,b)=>a.localeCompare(b,'th'))}
  function isInvestigationCriteriaMet(value){return String(value||'').trim()==='เข้าเกณฑ์'}
  function roleCanManage(){return currentUser&&['Super Admin','Manager'].includes(currentUser.role)}
  function roleCanRecord(){return currentUser&&['Super Admin','Manager','Admin'].includes(currentUser.role)}

  function showPage(page,btn){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));el('page-'+page).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');toggleSidebar(false);
    if(page==='admin')loadAdmin();if(page==='library')renderLibrary();if(page==='records'||page==='reporter')renderTables()
  }

  function applyTheme(){
    document.documentElement.style.setProperty('--primary',settings.PRIMARY_COLOR||'#0f766e');
    document.documentElement.style.setProperty('--secondary',settings.SECONDARY_COLOR||'#2563eb');
    const logo=settings.LOGO_URL||'https://lh3.googleusercontent.com/d/1ANG8ALHZASMzdI4MFLtZHwbWcwS0vMWQ';
    el('logoImg').src=logo;el('adminLogoPreview').src=logo;
    el('appName').textContent=settings.APP_NAME||'Smart SRRT Dashboard & AI Reporter';
    el('appSubtitle').textContent=settings.APP_SUBTITLE||'ระบบบริหารจัดการข้อมูลระบาดวิทยาระดับพื้นที่';
    el('sideTitle').textContent=settings.APP_NAME||'Smart SRRT';
    el('sideOrg').textContent=settings.ORG_NAME||'District Edition';
    el('bannerText').innerHTML='<i class="fa-solid fa-bullhorn"></i> '+escapeHtml(settings.BANNER_TEXT||'ระบบพร้อมใช้งาน');
    el('closedBox').style.display=String(settings.SYSTEM_STATUS||'open')==='closed'?'block':'none'
  }

  async function boot(){
    try{
      const b=await gs('getAppBoot',token);settings=b.settings||{};master=b.master||{};areas=b.areas||[];currentContent=b.content||[];currentUser=b.user;
      applyTheme();updateAuthBox();buildRecordForm();setupDashboardFilters();
      if(currentUser)void recoverReportJob();
      google.charts.setOnLoadCallback(loadDashboard)
    }catch(e){toast(e.message||e)}
  }

  function updateAuthBox(){
    const box=el('authBox');
    document.querySelectorAll('.auth-only').forEach(x=>x.style.display=roleCanRecord()?'flex':'none');
    document.querySelectorAll('.manager-only').forEach(x=>x.style.display=roleCanManage()?'flex':'none');
    if(currentUser){
      box.innerHTML=`<b>${escapeHtml(currentUser.name)}</b><span>${escapeHtml(currentUser.role)} | ${escapeHtml(currentUser.email)}</span><button onclick="doLogout()">ออกจากระบบ</button>`
    }else{
      box.innerHTML='<b>ยังไม่ได้เข้าสู่ระบบ</b><span>ผู้ใช้ทั่วไปดู Dashboard สรุปได้</span><button onclick="openLogin()">เข้าสู่ระบบ</button>'
    }
    if(el('eventDetailPanel'))el('eventDetailPanel').style.display=currentUser?'block':'none';
    if(el('publicAggregateNotice'))el('publicAggregateNotice').style.display=currentUser?'none':'block';
  }

  function openLogin(){openModal('loginModal')}
  async function doLogin(){
    try{
      const r=await gs('login',{email:el('loginEmail').value,password:el('loginPassword').value});
      if(!r.ok){toast(r.message);return}
      token=r.token;localStorage.setItem('SRRT_TOKEN',token);currentUser=r.user;closeModal('loginModal');updateAuthBox();toast('เข้าสู่ระบบสำเร็จ');void recoverReportJob();await loadDashboard()
    }catch(e){toast(e.message||e)}
  }
  async function doLogout(){stopReportPolling();activeReportJob=null;localStorage.removeItem(REPORT_JOB_LOCAL_KEY);el('reportTaskIndicator').style.display='none';++reportHistoryRequest;closeModal('reportHistoryModal');try{await gs('logout',token)}catch(e){}token='';localStorage.removeItem('SRRT_TOKEN');currentUser=null;allData=[];dashboardSummary=null;updateAuthBox();toast('ออกจากระบบแล้ว');showPage('dashboard',document.querySelector('[data-page="dashboard"]'));await loadDashboard()}
  async function register(){try{toast(await gs('registerUser',{name:el('regName').value,email:el('regEmail').value,password:el('regPass').value,org:el('regOrg').value}))}catch(e){toast(e.message||e)}}

  function setupDashboardFilters(){
    const source=areas.length?areas:allData.map(r=>({province:r.col13,amphoe:r.col12,tambon:r.col11,moo:r.col10,village:r.col29}));
    fillSelect(el('filterProvince'),unique(source.map(x=>x.province)),'ทุกจังหวัด',el('filterProvince').value);
    updateDashboardAreaFilters('province')
  }
  function fillSelect(select,values,placeholder,current){
    select.innerHTML=`<option value="">${placeholder}</option>`+values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    if(values.includes(current))select.value=current
  }
  function updateDashboardAreaFilters(level){
    const p=el('filterProvince').value,a=level==='province'?'':el('filterAmphoe').value,t=level==='tambon'?el('filterTambon').value:'';
    const source=(areas.length?areas:allData.map(r=>({province:r.col13,amphoe:r.col12,tambon:r.col11,moo:r.col10,village:r.col29}))).filter(x=>(!p||x.province===p)&&(!a||x.amphoe===a)&&(!t||x.tambon===t));
    if(level==='province')fillSelect(el('filterAmphoe'),unique(source.map(x=>x.amphoe)),'ทุกอำเภอ','');
    const amph=el('filterAmphoe').value;
    const source2=source.filter(x=>!amph||x.amphoe===amph);
    if(level==='province'||level==='amphoe')fillSelect(el('filterTambon'),unique(source2.map(x=>x.tambon)),'ทุกตำบล','');
    const tamb=el('filterTambon').value;
    const source3=source2.filter(x=>!tamb||x.tambon===tamb);
    fillSelect(el('filterVillage'),unique(source3.map(x=>x.village||('หมู่ '+x.moo))),'ทุกหมู่บ้าน','')
  }

  async function loadDashboard(){
    try{
      const filter={startDate:el('startDate').value,endDate:el('endDate').value,province:el('filterProvince').value,amphoe:el('filterAmphoe').value,tambon:el('filterTambon').value,village:el('filterVillage').value};
      if(currentUser){
        dashboardSummary=null;
        allData=await gs('getDashboardData',token,filter);
      }else{
        allData=[];
        dashboardSummary=await gs('getPublicDashboardData',filter);
      }
      updateDashboard();renderTables();if(!areas.length&&currentUser)setupDashboardFilters()
    }catch(e){toast(e.message||e)}
  }
  function resetFilter(){['startDate','endDate','filterProvince','filterAmphoe','filterTambon','filterVillage'].forEach(id=>el(id).value='');setupDashboardFilters();loadDashboard()}
  function villageLabel(r){return r.col29?`บ้าน${r.col29}${r.col10?' หมู่ '+r.col10:''}`:(r.col10?`หมู่ ${r.col10}`:'ไม่ระบุหมู่บ้าน')}
  function locationLabel(r){return `${villageLabel(r)} ต.${r.col11||'-'} อ.${r.col12||'-'} จ.${r.col13||'-'}`}
  function updateDashboard(){
    if(!currentUser){
      const s=dashboardSummary||{kpi:{}},k=s.kpi||{};
      el('kpiTotal').textContent=k.events||0;el('kpiCriteria').textContent=k.criteria||0;el('kpiInvestigated').textContent=k.investigated||0;el('kpiRate').textContent=(k.investigationRate||0)+'%';
      el('smartInsight').innerHTML=makePublicInsight(s);drawCharts();return
    }
    const total=allData.length,criteria=allData.filter(r=>isInvestigationCriteriaMet(r.col17)).length,investigated=allData.filter(r=>r.col26).length;
    const rate=criteria?Math.round(investigated/criteria*100):(total?Math.round(investigated/total*100):0);
    el('kpiTotal').textContent=total;el('kpiCriteria').textContent=criteria;el('kpiInvestigated').textContent=investigated;el('kpiRate').textContent=rate+'%';
    el('smartInsight').innerHTML=makeInsight(total);drawCharts()
  }
  function makePublicInsight(s){
    const k=s&&s.kpi?s.kpi:{};
    if(!k.events)return'ไม่มีข้อมูลในช่วงเวลาหรือพื้นที่ที่เลือก';
    const pending=Number(k.pendingCriteria||0);
    return`พบเหตุการณ์ <b>${Number(k.events||0)}</b> รายการ โรค/เหตุการณ์ที่พบมากที่สุดคือ <b>${escapeHtml(s.topDisease||'ไม่ระบุ')}</b> พื้นที่ที่ควรติดตามคือ <b>${escapeHtml(s.topVillage||'ไม่ระบุ')}</b><br>${pending?`<span style="color:#dc2626;font-weight:700">มีเหตุการณ์เข้าเกณฑ์แต่ยังไม่ระบุวันที่ลงสอบสวน ${pending} รายการ</span>`:`<span style="color:#16a34a;font-weight:700">เหตุการณ์เข้าเกณฑ์มีการบันทึกการสอบสวนครบถ้วนตามข้อมูลปัจจุบัน</span>`}`
  }
  function makeInsight(total){
    if(!total)return'ไม่มีข้อมูลในช่วงเวลาหรือพื้นที่ที่เลือก';
    const topDisease=topBy(r=>r.col6),topVillage=topBy(r=>villageLabel(r)),pending=allData.filter(r=>isInvestigationCriteriaMet(r.col17)&&!r.col26).length;
    return`พบเหตุการณ์ <b>${total}</b> รายการ โรค/เหตุการณ์ที่พบมากที่สุดคือ <b>${escapeHtml(topDisease)}</b> พื้นที่ที่ควรติดตามคือ <b>${escapeHtml(topVillage)}</b><br>${pending?`<span style="color:#dc2626;font-weight:700">มีเหตุการณ์เข้าเกณฑ์แต่ยังไม่ระบุวันที่ลงสอบสวน ${pending} รายการ</span>`:`<span style="color:#16a34a;font-weight:700">เหตุการณ์เข้าเกณฑ์มีการบันทึกการสอบสวนครบถ้วนตามข้อมูลปัจจุบัน</span>`}`
  }
  function topBy(getter){const m={};allData.forEach(r=>{const k=getter(r)||'ไม่ระบุ';m[k]=(m[k]||0)+1});return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||'ไม่ระบุ'}
  function countMap(getter){const m={};allData.forEach(r=>{const k=getter(r)||'ไม่ระบุ';m[k]=(m[k]||0)+1});return Object.entries(m)}
  function drawCharts(){
    if(!google.visualization)return;
    if(!currentUser){
      const s=dashboardSummary||{};
      draw('barChart','ColumnChart',[['หมู่บ้าน','จำนวน'],...(s.byVillage||[])],{legend:'none',colors:[settings.PRIMARY_COLOR||'#0f766e'],hAxis:{slantedText:true,slantedTextAngle:45}});
      draw('lineChart','LineChart',[['เดือน','จำนวน'],...(s.byMonth||[])],{legend:'none',colors:[settings.SECONDARY_COLOR||'#2563eb'],curveType:'function'});
      draw('pieDisease','PieChart',[['กลุ่มโรค','จำนวน'],...(s.byDiseaseGroup||[])],{pieHole:.42});
      draw('pieRisk','PieChart',[['ความเสี่ยง','จำนวน'],...(s.byRisk||[])],{pieHole:.42});return
    }
    draw('barChart','ColumnChart',[['หมู่บ้าน','จำนวน'],...countMap(r=>villageLabel(r))],{legend:'none',colors:[settings.PRIMARY_COLOR||'#0f766e'],hAxis:{slantedText:true,slantedTextAngle:45}});
    draw('lineChart','LineChart',monthRows(),{legend:'none',colors:[settings.SECONDARY_COLOR||'#2563eb'],curveType:'function'});
    draw('pieDisease','PieChart',[['กลุ่มโรค','จำนวน'],...countMap(r=>r.col5)],{pieHole:.42});
    draw('pieRisk','PieChart',[['ความเสี่ยง','จำนวน'],...countMap(r=>r.col19)],{pieHole:.42})
  }
  function draw(id,type,arr,opt){const target=el(id);if(!target)return;new google.visualization[type](target).draw(google.visualization.arrayToDataTable(arr.length>1?arr:[arr[0],['-',0]]),Object.assign({chartArea:{width:'80%',height:'70%'},fontName:'Prompt'},opt||{}))}
  function monthRows(){const m={};allData.forEach(r=>{if(r.col2){const k=r.col2.substring(0,7);m[k]=(m[k]||0)+1}});return[['เดือน','จำนวน'],...Object.keys(m).sort().map(k=>[k,m[k]])]}
  function riskBadge(v){let c='status ';if((v||'').includes('สูง'))c+='st-high';else if((v||'').includes('ปานกลาง'))c+='st-mid';else c+='st-low';return`<span class="${c}">${escapeHtml(v||'-')}</span>`}
  function lifecycleBadge(r){
    const code=String(r&&r.eventLifecycle||''),label=r&&r.eventLifecycleLabel?r.eventLifecycleLabel:'-';
    let c='status ';
    if(code==='investigated'||code==='closed')c+='st-low';
    else if(code==='investigation_required'||code==='criteria_pending'||code==='verification_pending')c+='st-mid';
    else if(code==='voided'||code==='verification_rejected')c+='st-high';
    else c+='';
    return`<span class="${c}">${escapeHtml(label)}</span>`
  }
  function consistencyWarningBadge(r){
    const warnings=Array.isArray(r&&r.eventConsistencyWarnings)?r.eventConsistencyWarnings:[];
    if(!warnings.length)return'';
    const title=warnings.map(w=>w&&w.message?w.message:String(w&&w.code||'ตรวจสอบความสอดคล้อง')).join('\n');
    return` <span class="status st-mid" title="${escapeHtml(title)}"><i class="fa-solid fa-triangle-exclamation"></i> ${warnings.length}</span>`
  }
  function ownerLabel(r){
    if(!r||!r.ownerUserId)return'<span class="mini">ยังไม่กำหนด</span>';
    if(r.ownerMissing)return'<span class="status st-high">ไม่พบบัญชีผู้ใช้</span>';
    const name=r.ownerName||r.ownerEmail||r.ownerUserId;
    const detail=r.ownerOrg?`<div class="mini">${escapeHtml(r.ownerOrg)}</div>`:'';
    return`<b>${escapeHtml(name)}</b>${detail}`
  }
  async function openOwnerModal(i){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับกำหนดผู้รับผิดชอบ');return}
    const r=allData[i];if(!r||!r.eventId){toast('ไม่พบ EventID');return}
    if(String(r.recordStatus||'active').toLowerCase()==='closed'){toast('เหตุการณ์นี้ถูกปิดแล้ว กรุณาเปิดเหตุการณ์อีกครั้งก่อนเปลี่ยนผู้รับผิดชอบ');return}
    try{
      assignableOwnerCache=await gs('listAssignableEventOwners',token);
      el('ownerEventId').value=r.eventId;el('ownerRevision').value=String(r.revision||1);
      el('ownerUserId').innerHTML='<option value="">-- ยังไม่กำหนด --</option>'+assignableOwnerCache.map(u=>`<option value="${escapeHtml(u.userId)}">${escapeHtml(u.name||u.email)} — ${escapeHtml(u.role||'')}${u.org?` — ${escapeHtml(u.org)}`:''}</option>`).join('');
      el('ownerUserId').value=r.ownerUserId||'';
      openModal('ownerModal')
    }catch(e){toast(e.message||e)}
  }
  async function saveEventOwner(){
    const btn=el('saveOwnerBtn');
    try{
      btn.disabled=true;
      const msg=await gs('assignEventOwner',token,el('ownerEventId').value,el('ownerUserId').value,Number(el('ownerRevision').value||0));
      closeModal('ownerModal');toast(msg);await loadDashboard()
    }catch(e){toast(e.message||e)}
    finally{btn.disabled=false}
  }

  function formatFileSize(bytes){
    const n=Number(bytes||0);
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB'
  }
  function attachmentButton(r,i){
    const count=Number(r&&r.attachmentCount||0);
    return`<button class="btn light" onclick="openAttachmentModal(${i})"><i class="fa-solid fa-paperclip"></i> ${count}</button>`
  }
  async function openAttachmentModal(i){
    if(!currentUser){openLogin();return}
    const r=allData[i];if(!r||!r.eventId){toast('ไม่พบ EventID');return}
    const closed=String(r.recordStatus||'active').toLowerCase()==='closed';
    el('attachmentEventId').value=r.eventId;
    el('attachmentRevision').value=String(r.revision||1);
    el('attachmentClosed').value=closed?'1':'0';
    el('attachmentFile').value='';
    el('attachmentDescription').value='';
    el('attachmentUploadPanel').style.display=roleCanRecord()&&!closed?'block':'none';
    el('attachmentReadOnlyNotice').style.display=closed?'block':'none';
    openModal('attachmentModal');
    await loadAttachmentList()
  }
  async function loadAttachmentList(){
    const eventId=el('attachmentEventId').value;
    if(!eventId)return;
    try{
      const items=await gs('listEventAttachments',token,eventId);
      const closed=el('attachmentClosed').value==='1';
      el('attachmentList').innerHTML=items.map(a=>{
        const remove=roleCanManage()&&!closed?`<button class="btn red" onclick='removeAttachment(${JSON.stringify(a.attachmentId||"")})'><i class="fa-solid fa-xmark"></i> นำออก</button>`:'';
        return`<div class="content-item"><h4><i class="fa-solid fa-file"></i> ${escapeHtml(a.fileName||'ไฟล์แนบ')}</h4><p>${escapeHtml(a.description||'ไม่มีรายละเอียด')}</p><div class="mini">${escapeHtml(formatFileSize(a.sizeBytes))} · ${escapeHtml(a.uploadedAt||'')} · ${escapeHtml(a.uploadedBy||'')}</div><div class="actions" style="justify-content:flex-start"><button class="btn secondary" onclick='downloadAttachment(${JSON.stringify(a.attachmentId||"")})'><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>${remove}</div></div>`
      }).join('')||'<div class="help">ยังไม่มีเอกสารแนบสำหรับเหตุการณ์นี้</div>'
    }catch(e){el('attachmentList').innerHTML='<div class="help">'+escapeHtml(e.message||e)+'</div>'}
  }
  function attachmentMimeForFile(file){
    if(file&&file.type)return file.type;
    const name=String(file&&file.name||'').toLowerCase();
    if(name.endsWith('.pdf'))return'application/pdf';
    if(name.endsWith('.jpg')||name.endsWith('.jpeg'))return'image/jpeg';
    if(name.endsWith('.png'))return'image/png';
    if(name.endsWith('.webp'))return'image/webp';
    if(name.endsWith('.docx'))return'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    if(name.endsWith('.xlsx'))return'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    return''
  }
  function fileToBase64(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
      reader.onerror=()=>reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
      reader.readAsDataURL(file)
    })
  }
  async function uploadAttachment(){
    if(!roleCanRecord()){toast('สิทธิ์ไม่เพียงพอสำหรับแนบไฟล์');return}
    if(el('attachmentClosed').value==='1'){toast('เหตุการณ์นี้ถูกปิดแล้ว');return}
    const file=el('attachmentFile').files&&el('attachmentFile').files[0];
    if(!file){toast('กรุณาเลือกไฟล์แนบ');return}
    if(file.size>5*1024*1024){toast('ไฟล์แนบต้องมีขนาดไม่เกิน 5 MB');return}
    const btn=el('uploadAttachmentBtn');
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด';
      const base64=await fileToBase64(file);
      const result=await gs('uploadEventAttachment',token,el('attachmentEventId').value,{
        name:file.name,mimeType:attachmentMimeForFile(file),base64:base64,description:el('attachmentDescription').value
      },Number(el('attachmentRevision').value||0));
      el('attachmentRevision').value=String(result.revision||el('attachmentRevision').value);
      toast(result.message||'แนบไฟล์เรียบร้อยแล้ว');
      el('attachmentFile').value='';el('attachmentDescription').value='';
      await loadDashboard();
      const refreshed=allData.find(x=>x.eventId===el('attachmentEventId').value);
      if(refreshed)el('attachmentRevision').value=String(refreshed.revision||1);
      await loadAttachmentList()
    }catch(e){toast(e.message||e)}
    finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-upload"></i> แนบไฟล์'}
  }
  async function downloadAttachment(attachmentId){
    try{
      const result=await gs('downloadEventAttachment',token,attachmentId);
      const binary=atob(result.base64||'');
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      const blob=new Blob([bytes],{type:result.mimeType||'application/octet-stream'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=result.fileName||'attachment';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000)
    }catch(e){toast(e.message||e)}
  }

      if(request!==reportHistoryRequest||token!==authToken||!currentUser)return;

        (Number(result.invalidCount||0)?' · พบแถวทะเบียนที่ไม่สมบูรณ์ '+Number(result.invalidCount)+' รายการ':'');
      el('reportHistoryList').innerHTML=entries.length?entries.map((r,i)=>{

          ?'<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> เปิด Google Doc</a>'

  function showReportGenerationStatus(message,url){
    el('reportResultStatus').textContent=String(message||'');
    const link=el('reportResultLink');
    const target=String(url||'');
    const valid=/^https:\/\/docs\.google\.com\/document\/d\/[A-Za-z0-9_-]+(?:\/|$)/.test(target);
    if(valid)link.href=target;
    else link.removeAttribute('href');
    link.style.display=valid?'inline-flex':'none';
    return valid;
  }
  function paintReportTask(job){
    if(!job)return;
    if(activeReportJob&&activeReportJob.id!==job.id&&!reportJobTerminal(activeReportJob))return;
    if(activeReportJob&&activeReportJob.id===job.id){
      if(reportJobTerminal(activeReportJob)&&!reportJobTerminal(job))return;
      if(activeReportJob.status==='cancel_requested'&&job.status==='running')return;
    }
    activeReportJob=job;
    localStorage.setItem(REPORT_JOB_LOCAL_KEY,job.id);
    const label=reportStageLabel(job);
    const detail=job.message ? ' · '+String(job.message) : '';
    const possibleDoc=job.status==='completed'?job.documentUrl:null;
    showReportGenerationStatus(label+detail,possibleDoc);
    const indicator=el('reportTaskIndicator');
    indicator.style.display='inline-flex';
    el('reportTaskStatus').textContent=label;
    const terminal=reportJobTerminal(job);
    el('closeReportJobBtn').innerHTML=terminal?'<i class="fa-solid fa-xmark"></i> ปิดหน้าต่าง':'<i class="fa-solid fa-window-minimize"></i> ปิดหน้าต่าง · ทำงานต่อ';
    const cancel=el('cancelReportJobBtn');
    cancel.style.display=(!terminal&&job.status!=='finalizing')?'inline-flex':'none';
    cancel.disabled=job.status==='cancel_requested';
    const close=el('dismissReportJobBtn');
    close.style.display=terminal?'inline-flex':'none';
    if(terminal){
      reportGenerationInFlight.clear();
      stopReportPolling();
      if(!el('reportResultModal').classList.contains('open'))toast(label);
    }else{
      reportGenerationInFlight.add(job.eventId);
      startReportPolling();
    }
  }
  function reopenReportTask(){
    if(!activeReportJob)return;
    openModal('reportResultModal');
    showReportGenerationStatus(reportStageLabel(activeReportJob)+(activeReportJob.message?' · '+activeReportJob.message:''),activeReportJob.status==='completed'?activeReportJob.documentUrl:null);
  }
  function closeReportTaskModal(){
    closeModal('reportResultModal');
    if(activeReportJob&&!reportJobTerminal(activeReportJob))toast('ปิดหน้าต่างแล้ว งานยังดำเนินต่อขณะที่หน้าเว็บนี้เปิดอยู่');
  }
  function dismissReportTask(){
    if(!reportJobTerminal(activeReportJob))return;
    stopReportPolling();
    const dismissId=activeReportJob.id;
    const session=token;
    activeReportJob=null;
    localStorage.removeItem(REPORT_JOB_LOCAL_KEY);
    void gs('dismissReportJob',session,dismissId).catch(()=>{});
    el('reportTaskIndicator').style.display='none';
    closeModal('reportResultModal');
  }
  function stopReportPolling(){if(reportPollTimer){clearInterval(reportPollTimer);reportPollTimer=null}}
  function startReportPolling(){
    if(reportPollTimer||!activeReportJob||reportJobTerminal(activeReportJob))return;
    reportPollTimer=setInterval(()=>{void pollReportTask()},7000);
  }
  async function pollReportTask(){
    if(reportPollBusy||!activeReportJob||reportJobTerminal(activeReportJob)||!currentUser)return;
    reportPollBusy=true;
    const id=activeReportJob.id,session=token;
    try{
      const state=await gs('getReportJobStatus',session,id);
      if(token===session&&activeReportJob&&activeReportJob.id===id)paintReportTask(state);
    }catch(error){
      // A transient status-lookup failure is not proof that generation stopped.
      if(activeReportJob&&activeReportJob.id===id){
        el('reportTaskStatus').textContent='ตรวจสอบสถานะไม่ได้ · งานอาจยังทำอยู่';
      }
    }finally{reportPollBusy=false}
  }
  async function cancelCurrentReportTask(){
    if(!activeReportJob||reportJobTerminal(activeReportJob)||activeReportJob.status==='finalizing')return;
    if(!confirm('ต้องการขอยกเลิกการสร้างรายงานนี้หรือไม่? หาก Gemini กำลังตอบ ระบบจะรอจนถึงจุดที่หยุดได้ก่อน'))return;
    const id=activeReportJob.id,session=token;
    const btn=el('cancelReportJobBtn');
    btn.disabled=true;
    try{
      const state=await gs('cancelReportJob',session,id);
      if(token===session&&activeReportJob&&activeReportJob.id===id)paintReportTask(state);
    }catch(e){toast('ไม่สามารถส่งคำขอยกเลิก: '+String(e.message||e))}
    finally{btn.disabled=!!(activeReportJob&&activeReportJob.status==='cancel_requested')}
  }
  async function recoverReportJob(){
    if(!currentUser||!token)return;
    const old=localStorage.getItem(REPORT_JOB_LOCAL_KEY);
    try{
      // Owner-only backend pointer permits recovery after browser reload.
      const state=old ? await gs('getReportJobStatus',token,old) : await gs('getCurrentReportJob',token);
      if(state){
        paintReportTask(state);
        if(state.status==='queued') void runReportJobClient(state.id,token);
      }
    }catch(error){
      // Do not assert cancellation/success if page was closed during RPC.
      localStorage.removeItem(REPORT_JOB_LOCAL_KEY);
    }
  }
  async function runReportJobClient(jobId,session){
    try{
      const state=await gs('runReportJob',session,jobId);
      if(token===session&&activeReportJob&&activeReportJob.id===jobId)paintReportTask(state);
    }catch(e){
      // The server may still be executing despite a disconnected client callback.
      if(token===session&&activeReportJob&&activeReportJob.id===jobId){
        await pollReportTask();
        toast('ตรวจสอบคำขอไม่สำเร็จ กรุณาเปิดสถานะรายงาน ห้ามสั่งสร้างซ้ำ');
      }
    }
  }
  async function executeReport(eventId,btn){
    if(reportGenerationInFlight.size > 0 || reportReadinessInFlight.size > 1){
      toast('มีงานสร้างรายงานอยู่แล้ว เปิดสถานะงานเดิมแทนการส่งซ้ำ');
      if(activeReportJob)reopenReportTask();
      return;
    }
    const old=btn?btn.innerHTML:'';
    const session=token;
    try{
      if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังเริ่มงาน'}
      const job=await gs('createReportJob',session,eventId);
      if(session!==token||!currentUser)return;
      if(activeReportJob&&activeReportJob.id!==job.id&&!reportJobTerminal(activeReportJob)){
        toast('มีงานเดิมอยู่แล้ว กรุณารอตรวจสถานะก่อน');return;
      }
      paintReportTask(job);
      openModal('reportResultModal');
      if(job.status==='queued')void runReportJobClient(job.id,session);
    }catch(e){toast('เริ่มสร้างรายงานไม่สำเร็จ: '+String(e.message||e))}
    finally{if(btn){btn.disabled=false;btn.innerHTML=old}}
  }
  async function makeReport(eventId,btn){
    if(!eventId){toast('ไม่พบ EventID กรุณารีเฟรชหรืออัปเกรดโครงสร้างข้อมูล');return}
    if(reportGenerationInFlight.size > 0||reportReadinessInFlight.size > 0){
      toast('มีคำขอรายงานอยู่แล้ว กรุณาเปิดสถานะงานเดิม');
      if(activeReportJob)reopenReportTask();
      return;
    }
    reportReadinessInFlight.add(eventId);
    const old=btn.innerHTML;
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจข้อมูล';
      const readiness=await gs('getAIReportReadiness',token,eventId);
      if(readiness&&readiness.level==='ready'){
        return await executeReport(eventId,btn);
      }
      renderReportReadinessModal(readiness,eventId);
    }catch(e){toast(e.message||e)}
    finally{
      reportReadinessInFlight.delete(eventId);
      if(btn.disabled){btn.disabled=false;btn.innerHTML=old}
    }
  }

  }

    const items=master.content_category||[];
    select.innerHTML='<option value="">-- เลือก --</option>'+items.map(o=>`<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('');
    if(selected&&!items.some(o=>String(o.value)===String(selected))){
      const legacy=document.createElement('option');legacy.value=String(selected);legacy.textContent='[เลิกใช้งาน] '+String(selected);legacy.dataset.legacy='true';select.appendChild(legacy)
    }
    select.value=selected||''
  }

  async function loadContentAdmin(){try{const rows=await gs('listContent',token);el('contentAdminList').innerHTML=rows.map((r,i)=>`<div class="content-item"><h4>${escapeHtml(r.title)}</h4><p>${escapeHtml(r.category)} | ${escapeHtml(r.status)}</p><button class="btn light" onclick="editContent(${i})">แก้ไข</button></div>`).join('')||'ยังไม่มีข้อมูล';window._contentRows=rows}catch(e){toast(e.message||e)}}
  function openContentForm(){el('cId').value='';populateContentCategoryOptions('');el('cTitle').value='';el('cDesc').value='';el('cUrl').value='';el('cStatus').value='published';openModal('contentModal')}
  function editContent(i){const r=window._contentRows[i];el('cId').value=r.id;populateContentCategoryOptions(r.category);el('cTitle').value=r.title;el('cDesc').value=r.description;el('cUrl').value=r.url;el('cStatus').value=r.status;openModal('contentModal')}
  async function saveContentItem(){try{const item={id:el('cId').value,category:el('cCategory').value,title:el('cTitle').value,description:el('cDesc').value,url:el('cUrl').value,status:el('cStatus').value};toast(await gs('saveContent',token,item));closeModal('contentModal');loadContentAdmin();const b=await gs('getAppBoot',token);currentContent=b.content;renderLibrary()}catch(e){toast(e.message||e)}}
  async function loadAuditRetentionStatus(){
    try{
      const s=await gs('getAuditRetentionStatus',token);
      el('auditRetentionStatus').innerHTML=`เก็บ Audit ในฐานข้อมูลหลัก <b>${Number(s.retentionDays||0)} วัน</b> · Active <b>${Number(s.activeRows||0)}</b> รายการ · เข้าเกณฑ์ Archive <b>${Number(s.eligibleRows||0)}</b> รายการ${Number(s.malformedTimestampRows||0)?` · <span style="color:#b45309">Timestamp ผิดรูปแบบ ${Number(s.malformedTimestampRows||0)} รายการ (ยังคงไว้)</span>`:''}${s.oldestTimestamp?`<br>รายการเก่าสุด: ${escapeHtml(s.oldestTimestamp)} · Cutoff: ${escapeHtml(s.cutoff||'')}`:''}`;
      el('archiveAuditBtn').disabled=Number(s.eligibleRows||0)===0
    }catch(e){el('auditRetentionStatus').textContent=e.message||e}
  }
  async function archiveAuditNow(){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับ Archive Audit');return}
    if(!confirm('ยืนยัน Archive Audit ที่เก่ากว่า retention policy? ระบบจะคัดลอกไปไฟล์ Archive และตรวจสอบก่อนนำออกจาก AuditLogs'))return;
    const btn=el('archiveAuditBtn');
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลัง Archive';
      const r=await gs('archiveAuditLogs',token);
      toast(`Archive สำเร็จ ${Number(r.removedFromActiveRows||0)} รายการ`);
      await Promise.all([loadAudit(),loadAuditRetentionStatus()])
    }catch(e){toast(e.message||e)}
    finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-box-archive"></i> Archive รายการเก่า'}
  }
  async function loadAudit(){try{const rows=await gs('listAuditLogs',token,100);el('auditBody').innerHTML=rows.map(r=>`<tr><td>${escapeHtml(r.timestamp)}</td><td>${escapeHtml(r.email)}</td><td>${escapeHtml(r.action)}</td><td>${escapeHtml(r.targetSheet+':'+r.targetId)}</td></tr>`).join('')||'<tr><td colspan="4">ไม่มีข้อมูล</td></tr>'}catch(e){toast(e.message||e)}}
  function renderLibrary(){el('libraryList').innerHTML=(currentContent||[]).map(c=>`<div class="content-item"><h4><i class="fa-solid fa-file-lines"></i> ${escapeHtml(c.title)}</h4><p>${escapeHtml(c.category)}<br>${escapeHtml(c.description||'')}</p>${c.url?`<a href="${escapeHtml(c.url)}" target="_blank">เปิดเอกสาร <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`:''}</div>`).join('')||'<div class="card">ยังไม่มีประกาศ/คู่มือที่เผยแพร่</div>'}

  boot();
</script>
</body>
</html>
