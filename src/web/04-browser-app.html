<script>
  function renderReportReadinessModal(readiness,eventId){
    el('pendingReportEventId').value=eventId||'';
    const level=String(readiness&&readiness.level||'review');
    const count=Number(readiness&&readiness.warningCount||0);
    const headline=level==='limited'
      ?'ข้อมูลหลักยังไม่ครบ รายงานที่สร้างอาจมีจุดไข่ปลาหรือข้อจำกัดหลายส่วน'
      :'พบข้อมูลที่ควรตรวจสอบก่อนสร้างรายงาน';
    el('reportReadinessSummary').innerHTML=`<b>${escapeHtml(readiness&&readiness.label||headline)}</b><br>${escapeHtml(headline)} · คำเตือน ${count} รายการ`;
    const warnings=Array.isArray(readiness&&readiness.warnings)?readiness.warnings:[];
    el('reportReadinessWarnings').innerHTML=warnings.map(w=>{
      const prefix=w.severity==='core'?'ข้อมูลหลัก':(w.severity==='consistency'?'ความสอดคล้อง':'ควรเพิ่มเติม');
      return`<div class="content-item"><b>${escapeHtml(prefix)}</b><p>${escapeHtml(w.message||w.code||'ควรตรวจสอบข้อมูล')}</p></div>`
    }).join('')||'<div class="help">ไม่พบคำเตือน</div>';
    openModal('reportReadinessModal')
  }
  const reportReadinessInFlight = new Set();
  const reportActionPreflightInFlight = new Set();
  let pendingReportExplicitRegeneration=false;
  let reportWarningContinueRequest=0,reportWarningContinueInFlight=false;
  const reportGenerationInFlight = new Set();
  const REPORT_JOB_LOCAL_KEY='SRRT_G32_REPORT_JOB_ID';
  const REPORT_TERMINAL_STATES=new Set(['completed','cancelled','failed','unknown']);
  let reportSummaryRequest=0,reportSummaryState={status:'idle',summaries:{}};
  let reportUnknownNeedsVerification=false,reportJobRecoveryRequest=0;
  let reportJobCreateInFlight=false,reportJobCreateRequest=0;
  async function refreshReportSummaries(){
    const request=++reportSummaryRequest,session=token;
    reportSummaryState={status:'loading',summaries:{}};
    refreshReportActionButtons();
    if(!currentUser||!roleCanRecord()){
      reportSummaryState={status:'idle',summaries:{}};return;
    }
    const ids=[...new Set(allData.map(e=>String(e.eventId||'').trim()).filter(Boolean))];
    if(!ids.length){reportSummaryState={status:'ready',summaries:{}};refreshReportActionButtons();return}
    try {
      // The server limits a single request to 500 IDs. One bounded request per batch,
      // not an N+1 history RPC per Event. Publish only after ALL batches succeeded.
      const summaries=Object.create(null);
      for(let offset=0;offset<ids.length;offset+=500){
        const batch=ids.slice(offset,offset+500);
        const response=await gs('getReportSummariesForEvents',session,batch);
        if(request!==reportSummaryRequest||session!==token||!currentUser)return;
        if(!response||!response.summaries||typeof response.summaries!=='object')
          throw new Error('ผลสรุปทะเบียนรายงานไม่ถูกต้อง');
        if(batch.some(id=>!Object.prototype.hasOwnProperty.call(response.summaries,id)))
          throw new Error('สรุปรายงานไม่ครบทุกเหตุการณ์');
        batch.forEach(id=>{summaries[id]=response.summaries[id]});
      }
      reportSummaryState={status:'ready',summaries:summaries};
    }catch(e){
      if(request!==reportSummaryRequest||session!==token||!currentUser)return;
      reportSummaryState={status:'error',summaries:{}};
      toast('ยังตรวจสอบประวัติรายงานไม่ได้ กรุณาลองรีเฟรชก่อนสร้างรายงาน');
    }finally{if(request===reportSummaryRequest&&session===token&&currentUser)refreshReportActionButtons()}
  }
  let activeReportJob=null, reportPollTimer=null, reportPollBusy=false;
  let reportCancelPendingJobId=null, reportCancelSubmitting=false;
  function reportActionState(eventId,compact){
    const job=activeReportJob&&!reportJobTerminal(activeReportJob)?activeReportJob:null;
    const matching=!!job&&String(job.eventId)===String(eventId);
    // An unknown server execution cannot be treated as a cancelled or failed job.
    if(reportUnknownNeedsVerification || (activeReportJob&&activeReportJob.status==='unknown')){
      // A historical registered document remains readable even when a later job is unknown.
      // Never allow implicit regeneration in this state.
      const old=reportSummaryState.summaries&&reportSummaryState.summaries[eventId];
      if(reportSummaryState.status==='ready'&&old&&old.count>0&&!old.invalidCount){
        return {disabled:false,busy:false,active:false,mode:'history',
          html:'<i class="fa-solid fa-file-lines" aria-hidden="true"></i> ดูรายงาน ('+old.count+') · ตรวจสอบงานค้าง'};
      }
      return {disabled:false,busy:false,active:false,mode:'verify',
        html:'<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ตรวจสอบสถานะรายงาน'};
    }
    if(reportJobCreateInFlight){
      return {disabled:true,busy:true,active:true,mode:'blocked',
        html:'<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> กำลังส่งคำขอรายงาน'};
    }
    if(matching){
      let label='กำลังสร้างรายงาน · ดูสถานะ';
      let icon='fa-spinner fa-spin';
      if(job.status==='cancel_requested'){label='กำลังขอยกเลิก · ดูสถานะ';icon='fa-hourglass-half'}
      else if(job.status==='finalizing'){label='กำลังบันทึก · ดูสถานะ';icon='fa-floppy-disk'}
      else if(job.status==='queued'){label='รอเริ่มรายงาน · ดูสถานะ';icon='fa-clock'}
      return {disabled:false,busy:true,active:true,mode:'job',
        html:'<i class="fa-solid '+icon+'" aria-hidden="true"></i> '+label};
    }
    if(job)return {disabled:true,busy:true,active:false,mode:'blocked',
      html:'<i class="fa-solid fa-lock" aria-hidden="true"></i> มีงานรายงานอื่นอยู่'};
    if(reportActionPreflightInFlight.size>0){
      const checking=reportActionPreflightInFlight.has(eventId);
      return {disabled:true,busy:true,active:checking,mode:'blocked',
        html:'<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> '+(checking?'กำลังตรวจทะเบียนรายงาน':'กำลังตรวจรายงานอื่น')};
    }
    if(reportReadinessInFlight.size>0){
      const checking=reportReadinessInFlight.has(eventId);
      return {disabled:true,busy:true,active:checking,mode:'blocked',
        html:'<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> '+(checking?'กำลังตรวจข้อมูล':'กำลังตรวจรายงานอื่น')};
    }
    const state=reportSummaryState;
    const summary=state.summaries&&state.summaries[eventId];
    if(state.status!=='ready'||!summary){
      return {disabled:false,busy:state.status==='loading',active:false,mode:'verify',
        html:'<i class="fa-solid fa-rotate" aria-hidden="true"></i> ตรวจสอบสถานะรายงาน'};
    }
    if(summary.invalidCount||!Number.isSafeInteger(Number(summary.count))||Number(summary.count)<0){
      return {disabled:false,busy:false,active:false,mode:'verify',
        html:'<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ตรวจสอบทะเบียนรายงาน'};
    }
    if(summary.count>0){
      return {disabled:false,busy:false,active:false,mode:'history',
        html:'<i class="fa-solid fa-file-lines" aria-hidden="true"></i> '+(summary.count===1?'ดูรายงาน':'ดูรายงาน ('+summary.count+')')};
    }
    return {disabled:false,busy:false,active:false,mode:'generate',html:'สร้างรายงาน AI'};
  }
  function reportActionButton(eventId,compact){
    const state=reportActionState(eventId,compact);
    return '<button class="btn green report-action-btn'+(state.active?' report-action-active':'')+'"'+
      ' data-report-event-id="'+escapeHtml(eventId||'')+'"'+
      ' data-report-compact="'+(compact?'1':'0')+'"'+
      ' aria-busy="'+String(state.busy)+'"'+
      (state.disabled?' disabled':'')+
      ' onclick="handleReportAction(this.dataset.reportEventId,this)">'+
      state.html+'</button>';
  }
  async function preflightFirstReportGeneration(eventId,btn){
    if(reportActionPreflightInFlight.size||!currentUser||!roleCanRecord()||!token)return;
    const session=token,user=currentUser,version=reportSummaryRequest;
    reportActionPreflightInFlight.add(eventId);
    refreshReportActionButtons();
    let canGenerate=false;
    try{
      // Summary state may be stale if another user generated this Event's first
      // registered report since the dashboard loaded. Re-read before a first draft.
      const result=await gs('getReportSummariesForEvents',session,[eventId]);
      if(session!==token||user!==currentUser||version!==reportSummaryRequest)return;
      const summary=result&&result.summaries&&result.summaries[eventId];
      if(!summary||!Number.isSafeInteger(summary.count)||summary.count<0||
         !Number.isSafeInteger(summary.invalidCount)||summary.invalidCount!==0)
        throw new Error('ยังยืนยันทะเบียนรายงานไม่ได้');
      if(reportSummaryState.status!=='ready'||!reportSummaryState.summaries[eventId])
        throw new Error('ข้อมูลหน้าเว็บเปลี่ยนระหว่างตรวจทะเบียน กรุณารีเฟรช');
      // Do not overwrite newer summaries or report execution status.
      reportSummaryState.summaries[eventId]=summary;
      if(summary.count>0){
        toast('มีรายงานที่ลงทะเบียนแล้ว กรุณากดดูรายงาน หากต้องการสร้างฉบับใหม่ให้เลือกในหน้ารายงาน');
      }else if(!reportUnknownNeedsVerification&&
        !(activeReportJob&&(!reportJobTerminal(activeReportJob)||activeReportJob.status==='unknown'))){
        canGenerate=true;
      }
    }catch(error){
      if(session===token&&user===currentUser&&version===reportSummaryRequest){
        reportSummaryState={status:'error',summaries:{}};
        toast('ยังยืนยันทะเบียนรายงานไม่ได้ กรุณาตรวจสอบสถานะก่อนสร้าง: '+String(error.message||error));
      }
    }finally{
      // G-33/R1: a stale preflight must not drop the in-flight marker of a newer session.
      if(session===token&&user===currentUser){
        reportActionPreflightInFlight.delete(eventId);
        refreshReportActionButtons();
      }
    }
    if(canGenerate&&session===token&&user===currentUser&&version===reportSummaryRequest){
      await makeReport(eventId,btn);
    }
  }
  function handleReportAction(eventId,btn){
    if(!currentUser||!roleCanRecord()){toast('ไม่มีสิทธิ์ใช้งานรายงาน');return}
    const state=reportActionState(eventId,false);
    if(state.mode==='job'){reopenReportTask();return}
    if(state.mode==='history'){
      const index=allData.findIndex(x=>String(x.eventId||'')===String(eventId));
      if(index<0){toast('ไม่พบเหตุการณ์ กรุณารีเฟรช');return}
      void openEventReportHistoryByIndex(index);return;
    }
    if(state.mode==='generate'){void preflightFirstReportGeneration(eventId,btn);return}
    if(state.mode==='verify'){
      if(activeReportJob&&activeReportJob.status==='unknown')reopenReportTask();
      toast('ยังไม่สามารถยืนยันสถานะรายงานได้ กรุณาตรวจสอบก่อนสร้างซ้ำ');
      if(reportUnknownNeedsVerification||activeReportJob&&activeReportJob.status==='unknown')
        void recoverReportJob();
      void refreshReportSummaries();
      return;
    }
    if(activeReportJob)reopenReportTask();
  }
  function refreshReportActionButtons(){
    if(typeof document.querySelectorAll!=='function')return;
    document.querySelectorAll('button[data-report-event-id]').forEach(btn=>{
      const id=btn.getAttribute('data-report-event-id')||'';
      const compact=btn.getAttribute('data-report-compact')==='1';
      const state=reportActionState(id,compact);
      btn.disabled=state.disabled;
      btn.innerHTML=state.html;
      btn.setAttribute('aria-busy',String(state.busy));
      btn.classList.toggle('report-action-active',state.active);
    });
  }

  function reportJobTerminal(job){return !!job&&REPORT_TERMINAL_STATES.has(job.status)}
  function reportStageLabel(job){
    if(!job)return 'ไม่มีงานสร้างรายงาน';
    if(job.status==='completed')return 'สร้างรายงานสำเร็จ';
    if(job.status==='cancelled')return 'ยกเลิกการสร้างรายงานแล้ว';
    if(job.status==='failed')return 'สร้างรายงานไม่สำเร็จ';
    if(job.status==='unknown')return 'ไม่สามารถยืนยันผล กรุณาตรวจประวัติรายงาน';
    if(job.status==='cancel_requested')return 'กำลังขอยกเลิก · รอให้ขั้นตอนปัจจุบันสิ้นสุด';
    if(job.status==='finalizing')return 'กำลังบันทึก Google Docs และทะเบียนรายงาน';
    const steps={
      queued:'รอเริ่มสร้างรายงาน',
      preparing:'กำลังเตรียมข้อมูลรายงาน',
      gemini_1:'กำลังเรียก Gemini 3.8 Flash · หัวข้อ 1–3',
      gemini_2:'กำลังเรียก Gemini 3.8 Flash · หัวข้อ 4–6',
      post_gemini:'กำลังเตรียมบันทึกเอกสาร'
    };
    return steps[job.stage]||'กำลังสร้างรายงานด้วย Gemini 3.8 Flash';
  }
  function showReportGenerationStatus(message,url){
    el('reportResultStatus').textContent=String(message||'');
    const link=el('reportResultLink');
    const target=String(url||'');
    const valid=/^https:\/\/docs\.google\.com\/document\/d\/[A-Za-z0-9_-]+(?:\/|$)/.test(target);
    if(valid)link.href=target;
    else link.removeAttribute('href');
    link.style.display=valid?'inline-flex':'none';
    return valid;
  }
  function paintReportTask(job){
    if(!job)return;
    if(activeReportJob&&activeReportJob.id!==job.id&&!reportJobTerminal(activeReportJob))return;
    if(activeReportJob&&activeReportJob.id===job.id){
      if(reportJobTerminal(activeReportJob)&&!reportJobTerminal(job))return;
      if(activeReportJob.status==='cancel_requested'&&job.status==='running')return;
    }
    const previousStatus=activeReportJob&&activeReportJob.id===job.id?activeReportJob.status:'';
    activeReportJob=job;
    if(job.status==='unknown')reportUnknownNeedsVerification=true;
    if(job.status==='completed')reportUnknownNeedsVerification=false;
    localStorage.setItem(REPORT_JOB_LOCAL_KEY,job.id);
    if(job.status==='completed'&&previousStatus!=='completed'){
      // A completed G-32 job is not equivalent to an already-refreshed registry view.
      reportSummaryState={status:'loading',summaries:{}};
      void refreshReportSummaries();
    }
    const label=reportStageLabel(job);
    const detail=job.message ? ' · '+String(job.message) : '';
    const possibleDoc=job.status==='completed'?job.documentUrl:null;
    showReportGenerationStatus(label+detail,possibleDoc);
    const indicator=el('reportTaskIndicator');
    indicator.style.display='inline-flex';
    el('reportTaskStatus').textContent=label;
    const terminal=reportJobTerminal(job);
    refreshReportActionButtons();
    // The confirmation must never outlive the job's cancellable state.
    if(reportCancelPendingJobId===job.id &&
       (terminal||job.status==='cancel_requested'||job.status==='finalizing')){
      hideReportCancelConfirm();
    }
    el('closeReportJobBtn').innerHTML=terminal?'<i class="fa-solid fa-xmark"></i> ปิดหน้าต่าง':'<i class="fa-solid fa-window-minimize"></i> ปิดหน้าต่าง · ทำงานต่อ';
    const cancel=el('cancelReportJobBtn');
    cancel.style.display=(!terminal&&job.status!=='finalizing')?'inline-flex':'none';
    cancel.disabled=job.status==='cancel_requested';
    const close=el('dismissReportJobBtn');
    close.style.display=terminal?'inline-flex':'none';
    if(terminal){
      reportGenerationInFlight.clear();
      stopReportPolling();
      if(!el('reportResultModal').classList.contains('open'))toast(label);
    }else{
      reportGenerationInFlight.add(job.eventId);
      startReportPolling();
    }
  }
  function reopenReportTask(){
    if(!activeReportJob)return;
    openModal('reportResultModal');
    showReportGenerationStatus(reportStageLabel(activeReportJob)+(activeReportJob.message?' · '+activeReportJob.message:''),activeReportJob.status==='completed'?activeReportJob.documentUrl:null);
  }
  function closeReportTaskModal(){
    closeModal('reportResultModal');
    if(activeReportJob&&!reportJobTerminal(activeReportJob))toast('ปิดหน้าต่างแล้ว งานยังดำเนินต่อขณะที่หน้าเว็บนี้เปิดอยู่');
  }
  function dismissReportTask(){
    if(!reportJobTerminal(activeReportJob))return;
    stopReportPolling();
    const dismissId=activeReportJob.id;
    const session=token;
    activeReportJob=null;
    localStorage.removeItem(REPORT_JOB_LOCAL_KEY);
    refreshReportActionButtons();
    void gs('dismissReportJob',session,dismissId).catch(()=>{});
    el('reportTaskIndicator').style.display='none';
    closeModal('reportResultModal');
  }
  function stopReportPolling(){if(reportPollTimer){clearInterval(reportPollTimer);reportPollTimer=null}}
  function startReportPolling(){
    if(reportPollTimer||!activeReportJob||reportJobTerminal(activeReportJob))return;
    reportPollTimer=setInterval(()=>{void pollReportTask()},7000);
  }
  async function pollReportTask(){
    if(reportPollBusy||!activeReportJob||reportJobTerminal(activeReportJob)||!currentUser)return;
    reportPollBusy=true;
    const id=activeReportJob.id,session=token;
    try{
      const state=await gs('getReportJobStatus',session,id);
      if(token===session&&activeReportJob&&activeReportJob.id===id)paintReportTask(state);
    }catch(error){
      // A transient status-lookup failure is not proof that generation stopped.
      // G-33/R1: a stale poll from an older session must not rewrite a newer
      // session's task status even for the same server-side job id.
      if(token===session&&activeReportJob&&activeReportJob.id===id){
        el('reportTaskStatus').textContent='ตรวจสอบสถานะไม่ได้ · งานอาจยังทำอยู่';
      }
    }finally{reportPollBusy=false}
  }
  function hideReportCancelConfirm(){
    reportCancelPendingJobId=null;
    closeModal('reportCancelConfirmModal');
    const returnFocus=el('cancelReportJobBtn');
    if(returnFocus && returnFocus.style.display!=='none' && !returnFocus.disabled)returnFocus.focus();
    else el('closeReportJobBtn').focus();
  }
  function closeReportCancelConfirm(){
    if(reportCancelSubmitting)return;
    hideReportCancelConfirm();
  }
  function cancelCurrentReportTask(){
    if(reportCancelSubmitting||!currentUser||!activeReportJob||reportJobTerminal(activeReportJob)||
       ['cancel_requested','finalizing'].includes(activeReportJob.status))return;
    reportCancelPendingJobId=activeReportJob.id;
    const warning=el('reportCancelConfirmError');
    warning.textContent='';
    warning.style.display='none';
    openModal('reportCancelConfirmModal');
    el('reportCancelKeepBtn').focus();
  }
  async function confirmReportCancelRequest(){
    // Ignore duplicate clicks during a pending RPC without dismissing the dialog.
    if(reportCancelSubmitting)return;
    if(!currentUser||!activeReportJob||
       activeReportJob.id!==reportCancelPendingJobId||reportJobTerminal(activeReportJob)||
       ['cancel_requested','finalizing'].includes(activeReportJob.status)){
      hideReportCancelConfirm();
      return;
    }
    const id=reportCancelPendingJobId,session=token;
    reportCancelSubmitting=true;
    const submit=el('reportCancelConfirmBtn'),keep=el('reportCancelKeepBtn');
    const previous=submit.innerHTML;
    const warning=el('reportCancelConfirmError');
    submit.disabled=true;keep.disabled=true;
    submit.textContent='กำลังส่งคำขอยกเลิก...';
    warning.textContent='';warning.style.display='none';
    try{
      const state=await gs('cancelReportJob',session,id);
      if(token===session&&currentUser&&activeReportJob&&activeReportJob.id===id){
        paintReportTask(state);
        hideReportCancelConfirm();
      }else{
        // Do not apply a stale result to a later login or another job.
        hideReportCancelConfirm();
      }
    }catch(error){
      if(token===session&&currentUser&&activeReportJob&&activeReportJob.id===id){
        warning.textContent='ยังยืนยันการรับคำขอยกเลิกไม่ได้ กรุณาตรวจสถานะงานก่อนส่งคำขอใหม่';
        warning.style.display='block';
      }else{
        hideReportCancelConfirm();
      }
    }finally{
      reportCancelSubmitting=false;
      submit.disabled=false;keep.disabled=false;submit.innerHTML=previous;
    }
  }
  document.addEventListener('keydown',event=>{
    if(!el('reportCancelConfirmModal').classList.contains('open'))return;
    if(event.key==='Escape'){
      event.preventDefault();
      if(!reportCancelSubmitting)closeReportCancelConfirm();
    }else if(event.key==='Tab'){
      // Keep keyboard navigation in the two-action confirmation dialog.
      const focusables=[el('reportCancelKeepBtn'),el('reportCancelConfirmBtn')].filter(b=>!b.disabled);
      if(!focusables.length){event.preventDefault();return}
      const first=focusables[0],last=focusables[focusables.length-1];
      if(event.shiftKey && (document.activeElement===first||!focusables.includes(document.activeElement))){
        event.preventDefault();last.focus();
      }else if(!event.shiftKey && (document.activeElement===last||!focusables.includes(document.activeElement))){
        event.preventDefault();first.focus();
      }
    }
  });
  async function recoverReportJob(){
    if(!currentUser||!token)return;
    const session=token,request=++reportJobRecoveryRequest;
    // A disconnected status lookup never proves that the old job stopped.
    // Gate generation until a successful authenticated status lookup completes.
    reportUnknownNeedsVerification=true;
    refreshReportActionButtons();
    try{
      const state=await gs('getCurrentReportJob',session);
      if(request!==reportJobRecoveryRequest||token!==session||!currentUser)return;
      if(state){
        reportUnknownNeedsVerification=state.status==='unknown';
        paintReportTask(state);
        if(state.status==='queued') void runReportJobClient(state.id,session);
      }else{
        reportUnknownNeedsVerification=false;
        if(activeReportJob&&activeReportJob.status==='unknown'){
          activeReportJob=null;
          el('reportTaskIndicator').style.display='none';
        }
        localStorage.removeItem(REPORT_JOB_LOCAL_KEY);
        refreshReportActionButtons();
      }
    }catch(error){
      if(request===reportJobRecoveryRequest&&token===session&&currentUser){
        reportUnknownNeedsVerification=true;
        refreshReportActionButtons();
        toast('ยังตรวจสอบงานรายงานเดิมไม่ได้ โปรดตรวจประวัติก่อนสร้างซ้ำ');
      }
    }
  }
  async function runReportJobClient(jobId,session){
    // G-33/R1: never kick a run RPC once the session that queued it is gone.
    if(token!==session||!currentUser)return;
    try{
      const state=await gs('runReportJob',session,jobId);
      if(token===session&&activeReportJob&&activeReportJob.id===jobId)paintReportTask(state);
    }catch(e){
      // The server may still be executing despite a disconnected client callback.
      if(token===session&&activeReportJob&&activeReportJob.id===jobId){
        await pollReportTask();
        // G-33/R1: the recovery await may span logout and a newer login; the
        // warning belongs only to the unchanged session and job that failed.
        if(token===session&&activeReportJob&&activeReportJob.id===jobId){
          toast('ตรวจสอบคำขอไม่สำเร็จ กรุณาเปิดสถานะรายงาน ห้ามสั่งสร้างซ้ำ');
        }
      }
    }
  }
  async function executeReport(eventId,btn){
    // G-33/R1: report generation stops at its dispatch point the moment the
    // local session is gone; logout invalidates token and user synchronously.
    if(!currentUser||!token)return;
    if(reportUnknownNeedsVerification||activeReportJob&&activeReportJob.status==='unknown'){
      toast('ยังไม่สามารถยืนยันงานรายงานเดิมได้ กรุณาตรวจสอบก่อนสร้างซ้ำ');return;
    }
    if(reportJobCreateInFlight||reportGenerationInFlight.size > 0 || reportReadinessInFlight.size > 1){
      toast('มีคำขอสร้างรายงานอยู่แล้ว กรุณาตรวจสอบสถานะงานเดิมก่อน');
      if(activeReportJob)reopenReportTask();
      return;
    }
    // The browser must not issue concurrent create RPCs before the G-32 server
    // returns a job pointer. An RPC timeout is NOT proof the server did not queue.
    const session=token,user=currentUser,request=++reportJobCreateRequest;
    const old=btn?btn.innerHTML:'';
    reportJobCreateInFlight=true;
    refreshReportActionButtons();
    try{
      if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังเริ่มงาน'}
      const job=await gs('createReportJob',session,eventId);
      if(session!==token||user!==currentUser||request!==reportJobCreateRequest)return;
      if(!job||!job.id||!job.eventId)throw new Error('ยังไม่สามารถยืนยันข้อมูลงานรายงานที่สร้างได้');
      if(activeReportJob&&activeReportJob.id!==job.id&&!reportJobTerminal(activeReportJob)){
        reportUnknownNeedsVerification=true;
        toast('มีงานเดิมอยู่แล้ว กรุณาตรวจสอบสถานะก่อนสร้างซ้ำ');return;
      }
      paintReportTask(job);
      openModal('reportResultModal');
      if(job.status==='queued')void runReportJobClient(job.id,session);
    }catch(e){
      if(session===token&&user===currentUser&&request===reportJobCreateRequest){
        // Network failure may happen AFTER the server accepted createReportJob.
        // Fail closed and require an authenticated G-32 recovery before retry.
        reportUnknownNeedsVerification=true;
        toast('ยังยืนยันผลคำขอสร้างรายงานไม่ได้ กรุณากดตรวจสอบสถานะก่อนสั่งสร้างใหม่: '+String(e.message||e));
      }
    }finally{
      if(request===reportJobCreateRequest){
        reportJobCreateInFlight=false;
        if(btn){btn.disabled=false;btn.innerHTML=old}
        refreshReportActionButtons();
      }
    }
  }
  async function makeReport(eventId,btn,allowExistingReport){
    if(!eventId){toast('ไม่พบ EventID กรุณารีเฟรชหรืออัปเกรดโครงสร้างข้อมูล');return}
    if(reportUnknownNeedsVerification||activeReportJob&&activeReportJob.status==='unknown'){
      toast('ยังไม่สามารถยืนยันผลของงานรายงานก่อนหน้าได้ กรุณาตรวจสอบสถานะก่อนสร้างซ้ำ');return;
    }
    if(reportJobCreateInFlight||reportGenerationInFlight.size > 0||reportReadinessInFlight.size > 0){
      toast('มีคำขอรายงานอยู่แล้ว กรุณาเปิดสถานะงานเดิม');
      if(activeReportJob)reopenReportTask();
      return;
    }
    reportReadinessInFlight.add(eventId);
    const old=btn.innerHTML,session=token,user=currentUser;
    refreshReportActionButtons();
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจข้อมูล';
      const readiness=await gs('getAIReportReadiness',session,eventId);
      if(session!==token||user!==currentUser)return;
      if(readiness&&readiness.level==='ready'){
        return await executeReport(eventId,btn);
      }
      pendingReportExplicitRegeneration=!!allowExistingReport;
      renderReportReadinessModal(readiness,eventId);
    }catch(e){if(session===token&&user===currentUser)toast(e.message||e)}
    finally{
      // G-33/R1: a readiness continuation that resolved during or after logout
      // must not touch the UI or drop locks that now belong to a newer session.
      if(session===token&&user===currentUser){
        reportReadinessInFlight.delete(eventId);
        // executeReport may have restored the temporary "กำลังตรวจข้อมูล" label.
        // The outer readiness action owns the original label and must always
        // restore it, whether queued, cancelled, failed or terminal.
        btn.disabled=false;
        btn.innerHTML=old;
        refreshReportActionButtons();
      }
    }
  }
  async function continueReportFromWarning(){
    const eventId=el('pendingReportEventId').value;
    if(!eventId){toast('ไม่พบ EventID');return}
    // G-33/R1: a warning continuation left over from before logout must not dispatch.
    if(!currentUser||!token)return;
    if(reportWarningContinueInFlight)return;
    if(reportGenerationInFlight.size > 0||reportUnknownNeedsVerification||
       activeReportJob&&(!reportJobTerminal(activeReportJob)||activeReportJob.status==='unknown')){
      toast('ยังมีคำขอรายงานที่ต้องตรวจสอบสถานะก่อน');return;
    }
    const request=++reportWarningContinueRequest;
    const session=token,user=currentUser,summaryVersion=reportSummaryRequest;
    const explicit=!!pendingReportExplicitRegeneration;
    const button=el('continueReportBtn'),old=button.innerHTML;
    reportWarningContinueInFlight=true;
    button.disabled=true;
    button.textContent='กำลังตรวจสอบทะเบียนรายงาน...';
    try{
      if(!explicit){
        // Warnings can stay open while another account registers the first
        // report. A stale zero-count may not authorize implicit regeneration.
        const result=await gs('getReportSummariesForEvents',session,[eventId]);
        if(session!==token||user!==currentUser||request!==reportWarningContinueRequest||
           summaryVersion!==reportSummaryRequest)return;
        const summary=result&&result.summaries&&result.summaries[eventId];
        if(!summary||!Number.isSafeInteger(summary.count)||summary.count<0||
           !Number.isSafeInteger(summary.invalidCount)||summary.invalidCount)
          throw new Error('ยังยืนยันทะเบียนรายงานไม่ได้');
        if(summary.count>0){
          // The action must now open existing history instead of silently
          // creating a second document that the user did not request.
          reportSummaryState={status:'loading',summaries:{}};
          closeModal('reportReadinessModal');
          void refreshReportSummaries();
          toast('มีรายงานที่ลงทะเบียนแล้ว กรุณาเปิดดูรายงานก่อน หากต้องการฉบับใหม่ให้ยืนยันในหน้ารายงาน');
          return;
        }
      }
      if(session!==token||user!==currentUser||request!==reportWarningContinueRequest||
         summaryVersion!==reportSummaryRequest)return;
      if(reportUnknownNeedsVerification||
         activeReportJob&&(!reportJobTerminal(activeReportJob)||activeReportJob.status==='unknown'))return;
      pendingReportExplicitRegeneration=false;
      closeModal('reportReadinessModal');
      await executeReport(eventId,button);
    }catch(error){
      if(session===token&&user===currentUser&&request===reportWarningContinueRequest){
        reportSummaryState={status:'error',summaries:{}};
        toast('ยังตรวจสอบทะเบียนรายงานไม่ได้: '+String(error.message||error));
      }
    }finally{
      if(request===reportWarningContinueRequest){
        reportWarningContinueInFlight=false;
        button.disabled=false;
        button.innerHTML=old;
        refreshReportActionButtons();
      }
    }
  }

    try{
      const s=await gs('getAuditRetentionStatus',token);
      el('auditRetentionStatus').innerHTML=`เก็บ Audit ในฐานข้อมูลหลัก <b>${Number(s.retentionDays||0)} วัน</b> · Active <b>${Number(s.activeRows||0)}</b> รายการ · เข้าเกณฑ์ Archive <b>${Number(s.eligibleRows||0)}</b> รายการ${Number(s.malformedTimestampRows||0)?` · <span style="color:#b45309">Timestamp ผิดรูปแบบ ${Number(s.malformedTimestampRows||0)} รายการ (ยังคงไว้)</span>`:''}${s.oldestTimestamp?`<br>รายการเก่าสุด: ${escapeHtml(s.oldestTimestamp)} · Cutoff: ${escapeHtml(s.cutoff||'')}`:''}`;
      el('archiveAuditBtn').disabled=Number(s.eligibleRows||0)===0
    }catch(e){el('auditRetentionStatus').textContent=e.message||e}
  }
  async function archiveAuditNow(){
    if(!roleCanManage()){toast('สิทธิ์ไม่เพียงพอสำหรับ Archive Audit');return}
    if(!confirm('ยืนยัน Archive Audit ที่เก่ากว่า retention policy? ระบบจะคัดลอกไปไฟล์ Archive และตรวจสอบก่อนนำออกจาก AuditLogs'))return;
    const btn=el('archiveAuditBtn');
    try{
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลัง Archive';
      const r=await gs('archiveAuditLogs',token);
      toast(`Archive สำเร็จ ${Number(r.removedFromActiveRows||0)} รายการ`);
      await Promise.all([loadAudit(),loadAuditRetentionStatus()])
    }catch(e){toast(e.message||e)}
    finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-box-archive"></i> Archive รายการเก่า'}
  }
  async function loadAudit(){try{const rows=await gs('listAuditLogs',token,100);el('auditBody').innerHTML=rows.map(r=>`<tr><td>${escapeHtml(r.timestamp)}</td><td>${escapeHtml(r.email)}</td><td>${escapeHtml(r.action)}</td><td>${escapeHtml(r.targetSheet+':'+r.targetId)}</td></tr>`).join('')||'<tr><td colspan="4">ไม่มีข้อมูล</td></tr>'}catch(e){toast(e.message||e)}}
  function renderLibrary(){el('libraryList').innerHTML=(currentContent||[]).map(c=>`<div class="content-item"><h4><i class="fa-solid fa-file-lines"></i> ${escapeHtml(c.title)}</h4><p>${escapeHtml(c.category)}<br>${escapeHtml(c.description||'')}</p>${c.url?`<a href="${escapeHtml(c.url)}" target="_blank">เปิดเอกสาร <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`:''}</div>`).join('')||'<div class="card">ยังไม่มีประกาศ/คู่มือที่เผยแพร่</div>'}

  boot();
</script>
</body>
</html>
