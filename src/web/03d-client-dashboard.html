<script>
  function setupDashboardFilters(){
    const source=areas.length?areas:allData.map(r=>({province:r.col13,amphoe:r.col12,tambon:r.col11,moo:r.col10,village:r.col29}));
    fillSelect(el('filterProvince'),unique(source.map(x=>x.province)),'ทุกจังหวัด',el('filterProvince').value);
    updateDashboardAreaFilters('province')
  }
  function fillSelect(select,values,placeholder,current){
    select.innerHTML=`<option value="">${placeholder}</option>`+values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    if(values.includes(current))select.value=current
  }
  function updateDashboardAreaFilters(level){
    const p=el('filterProvince').value,a=level==='province'?'':el('filterAmphoe').value,t=level==='tambon'?el('filterTambon').value:'';
    const source=(areas.length?areas:allData.map(r=>({province:r.col13,amphoe:r.col12,tambon:r.col11,moo:r.col10,village:r.col29}))).filter(x=>(!p||x.province===p)&&(!a||x.amphoe===a)&&(!t||x.tambon===t));
    if(level==='province')fillSelect(el('filterAmphoe'),unique(source.map(x=>x.amphoe)),'ทุกอำเภอ','');
    const amph=el('filterAmphoe').value;
    const source2=source.filter(x=>!amph||x.amphoe===amph);
    if(level==='province'||level==='amphoe')fillSelect(el('filterTambon'),unique(source2.map(x=>x.tambon)),'ทุกตำบล','');
    const tamb=el('filterTambon').value;
    const source3=source2.filter(x=>!tamb||x.tambon===tamb);
    fillSelect(el('filterVillage'),unique(source3.map(x=>x.village||('หมู่ '+x.moo))),'ทุกหมู่บ้าน','')
  }

  let dashboardLoadRequest=0;
  let dashboardPendingKey='',dashboardPendingPromise=null;
  const dashboardButtonOriginals=new Map();
  // UX-R1/P3-02: one visible state for in-flight, empty and failed Dashboard reads.
  // Never present stale figures as the currently selected filter's result.
  function setDashboardViewState(state){
    const messages={
      loading:'กำลังโหลดข้อมูลตามช่วงเวลาและพื้นที่ที่เลือก...',
      empty:'ไม่มีเหตุการณ์ในช่วงเวลาหรือพื้นที่ที่เลือก ลองปรับตัวกรองแล้วค้นหาอีกครั้ง',
      error:'ไม่สามารถโหลดข้อมูล Dashboard ได้ กรุณาลองค้นหาใหม่อีกครั้ง'
    };
    const page=el('page-dashboard'),message=el('dashboardLoadStatus');
    if(page&&typeof page.setAttribute==='function'){
      page.setAttribute('data-dashboard-state',state);
      page.setAttribute('aria-busy',String(state==='loading'));
    }
    for(const [id,label] of [['dashboardSearchBtn','กำลังค้นหา...'],
      ['dashboardResetBtn','กำลังโหลด...'],['dashboardReporterRefreshBtn','กำลังรีเฟรช...']]){
      const button=el(id);if(!button)continue;
      if(state==='loading'){
        if(!dashboardButtonOriginals.has(id))dashboardButtonOriginals.set(id,button.innerHTML);
        button.textContent=label;
        button.disabled=true;
        if(typeof button.setAttribute==='function')button.setAttribute('aria-busy','true');
      }else{
        if(dashboardButtonOriginals.has(id)){
          button.innerHTML=dashboardButtonOriginals.get(id);
          dashboardButtonOriginals.delete(id);
        }
        button.disabled=false;
        if(typeof button.setAttribute==='function')button.setAttribute('aria-busy','false');
      }
    }
    if(message){message.hidden=state==='ready';message.textContent=messages[state]||''}
    const privatePanel=el('eventDetailPanel');
    if(privatePanel)privatePanel.hidden=state==='loading'||state==='error';
    const captureButton=el('dashboardCaptureBtn');
    if(captureButton)captureButton.disabled=state==='loading'||state==='error';
    if(state==='loading'||state==='error'){
      const follow=el('dashboardFollowupSummary');
      if(follow)follow.textContent='';
    }
  }
  function refreshDashboardFollowupSummary(){
    const target=el('dashboardFollowupSummary');
    if(!target)return;
    if(!currentUser){target.textContent='';return;}
    const qualifying=allData.filter(r=>isInvestigationCriteriaMet(r.col17));
    const pending=qualifying.filter(r=>String(r.col26||'').trim()==='').length;
    target.textContent=!allData.length?'ไม่พบเหตุการณ์ในเงื่อนไขที่เลือก'
      :pending?'เข้าเกณฑ์แต่ยังไม่ระบุวันที่ลงสอบสวน '+pending+' จาก '+qualifying.length+' รายการ'
      :'ไม่มีรายการเข้าเกณฑ์ที่รอระบุวันที่ลงสอบสวนตามข้อมูลปัจจุบัน';
  }
  async function loadDashboard(){
    const session=token,hasUser=!!currentUser;
    const filter={startDate:el('startDate').value,endDate:el('endDate').value,
      province:el('filterProvince').value,amphoe:el('filterAmphoe').value,
      tambon:el('filterTambon').value,village:el('filterVillage').value};
    const key=JSON.stringify([session,hasUser,filter]);
    // The same read already in flight must not create duplicate RPCs.
    // A different filter/session may start a new read: only the latest owns UI.
    if(dashboardPendingKey===key&&dashboardPendingPromise)return dashboardPendingPromise;
    const request=++dashboardLoadRequest;
    dashboardPendingKey=key;
    ++reportSummaryRequest;
    reportSummaryState={status:'loading',summaries:{}};
    setDashboardViewState('loading');
    const task=(async()=>{
      try{
        const response=hasUser
          ?await gs('getDashboardData',session,filter)
          :await gs('getPublicDashboardData',filter);
        if(request!==dashboardLoadRequest||session!==token||hasUser!==!!currentUser)return;
        if(hasUser&&!Array.isArray(response))throw new Error('Invalid authenticated Dashboard response');
        if(!hasUser&&(!response||typeof response!=='object'||!response.kpi))throw new Error('Invalid public Dashboard response');
        if(hasUser){allData=response;dashboardSummary=null}
        else{allData=[];dashboardSummary=response}
        updateDashboard();renderTables();if(!areas.length&&currentUser)setupDashboardFilters();
        refreshDashboardFollowupSummary();
        const count=hasUser?allData.length:Number(dashboardSummary.kpi.events||0);
        setDashboardViewState(count>0?'ready':'empty');
        if(currentUser&&roleCanRecord())void refreshReportSummaries();
      }catch(e){
        if(request===dashboardLoadRequest&&session===token&&hasUser===!!currentUser){
          setDashboardViewState('error');toast(e.message||e)
        }
      }finally{
        if(request===dashboardLoadRequest){
          dashboardPendingKey='';dashboardPendingPromise=null;
        }
      }
    })();
    dashboardPendingPromise=task;
    return task;
  }
  function resetFilter(){['startDate','endDate','filterProvince','filterAmphoe','filterTambon','filterVillage'].forEach(id=>el(id).value='');setupDashboardFilters();loadDashboard()}
  function villageLabel(r){return r.col29?`บ้าน${r.col29}${r.col10?' หมู่ '+r.col10:''}`:(r.col10?`หมู่ ${r.col10}`:'ไม่ระบุหมู่บ้าน')}
  function locationLabel(r){return `${villageLabel(r)} ต.${r.col11||'-'} อ.${r.col12||'-'} จ.${r.col13||'-'}`}
  function updateDashboard(){
    if(!currentUser){
      const s=dashboardSummary||{kpi:{}},k=s.kpi||{};
      el('kpiTotal').textContent=k.events||0;el('kpiCriteria').textContent=k.criteria||0;el('kpiInvestigated').textContent=k.investigated||0;el('kpiRate').textContent=(k.investigationRate||0)+'%';
      el('smartInsight').innerHTML=makePublicInsight(s);drawCharts();return
    }
    const total=allData.length;
    const qualifying=allData.filter(r=>isInvestigationCriteriaMet(r.col17));
    const criteria=qualifying.length;
    const investigated=qualifying.filter(r=>String(r.col26||'').trim()!=='').length;
    const rate=criteria?Math.round(investigated/criteria*100):0;
    el('kpiTotal').textContent=total;el('kpiCriteria').textContent=criteria;el('kpiInvestigated').textContent=investigated;el('kpiRate').textContent=rate+'%';
    el('smartInsight').innerHTML=makeInsight(total);drawCharts()
  }
  function makePublicInsight(s){
    const k=s&&s.kpi?s.kpi:{};
    if(!k.events)return'ไม่มีข้อมูลในช่วงเวลาหรือพื้นที่ที่เลือก';
    const pending=Number(k.pendingCriteria||0);
    return`พบเหตุการณ์ <b>${Number(k.events||0)}</b> รายการ โรค/เหตุการณ์ที่พบมากที่สุดคือ <b>${escapeHtml(s.topDisease||'ไม่ระบุ')}</b> พื้นที่ที่ควรติดตามคือ <b>${escapeHtml(s.topVillage||'ไม่ระบุ')}</b><br>${pending?`<span style="color:#dc2626;font-weight:700">มีเหตุการณ์เข้าเกณฑ์แต่ยังไม่ระบุวันที่ลงสอบสวน ${pending} รายการ</span>`:`<span style="color:#16a34a;font-weight:700">เหตุการณ์เข้าเกณฑ์มีการบันทึกการสอบสวนครบถ้วนตามข้อมูลปัจจุบัน</span>`}`
  }
  function makeInsight(total){
    if(!total)return'ไม่มีข้อมูลในช่วงเวลาหรือพื้นที่ที่เลือก';
    const topDisease=topBy(r=>r.col6),topVillage=topBy(r=>villageLabel(r)),pending=allData.filter(r=>isInvestigationCriteriaMet(r.col17)&&String(r.col26||'').trim()==='').length;
    return`พบเหตุการณ์ <b>${total}</b> รายการ โรค/เหตุการณ์ที่พบมากที่สุดคือ <b>${escapeHtml(topDisease)}</b> พื้นที่ที่ควรติดตามคือ <b>${escapeHtml(topVillage)}</b><br>${pending?`<span style="color:#dc2626;font-weight:700">มีเหตุการณ์เข้าเกณฑ์แต่ยังไม่ระบุวันที่ลงสอบสวน ${pending} รายการ</span>`:`<span style="color:#16a34a;font-weight:700">เหตุการณ์เข้าเกณฑ์มีการบันทึกการสอบสวนครบถ้วนตามข้อมูลปัจจุบัน</span>`}`
  }
  function topBy(getter){const m={};allData.forEach(r=>{const k=getter(r)||'ไม่ระบุ';m[k]=(m[k]||0)+1});return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||'ไม่ระบุ'}
  function countMap(getter){const m={};allData.forEach(r=>{const k=getter(r)||'ไม่ระบุ';m[k]=(m[k]||0)+1});return Object.entries(m)}
  const dashboardChartInstances=new Map();
  function destroyDashboardCharts(clearDom=false){
    for(const chart of dashboardChartInstances.values())chart.destroy();
    dashboardChartInstances.clear();
    if(clearDom){
      for(const id of ['barChart','lineChart','pieDisease','pieRisk']){
        const target=el(id);
        if(target)target.replaceChildren();
        const data=el(id+'Table');
        if(data)data.replaceChildren();
      }
    }
  }
  function drawCharts(){
    if(typeof Chart!=='function')throw new Error('Pinned Chart.js is unavailable');
    if(!currentUser){
      const summary=dashboardSummary||{};
      draw('barChart','bar',[['หมู่บ้าน','จำนวน'],...(summary.byVillage||[])]);
      draw('lineChart','line',[['เดือน','จำนวน'],...(summary.byMonth||[])]);
      draw('pieDisease','doughnut',[['กลุ่มโรค','จำนวน'],...(summary.byDiseaseGroup||[])]);
      draw('pieRisk','doughnut',[['ความเสี่ยง','จำนวน'],...(summary.byRisk||[])]);
      return;
    }
    draw('barChart','bar',[['หมู่บ้าน','จำนวน'],...countMap(r=>villageLabel(r))]);
    draw('lineChart','line',monthRows());
    draw('pieDisease','doughnut',[['กลุ่มโรค','จำนวน'],...countMap(r=>r.col5)]);
    draw('pieRisk','doughnut',[['ความเสี่ยง','จำนวน'],...countMap(r=>r.col19)]);
  }
  // P3-03A: chart accessibility renders ONLY the exact aggregate series passed to the chart.
  // No direct allData, private EventID, narratives or fresh RPC access is introduced here.
  function renderDashboardChartData(id,arr){
    const ids={barChart:'barChartTable',lineChart:'lineChartTable',
      pieDisease:'pieDiseaseTable',pieRisk:'pieRiskTable'};
    const target=el(ids[id]);
    if(!target||typeof document==='undefined'||typeof document.createElement!=='function')return;
    const rows=Array.isArray(arr)?arr.slice(1).filter(row=>Array.isArray(row)&&row.length>=2)
      .map(row=>({label:String(row[0]??'-'),value:Number(row[1])}))
      .filter(row=>Number.isFinite(row.value)&&row.value>=0):[];
    if(!rows.length||!rows.some(row=>row.value>0)){
      target.textContent='ไม่มีข้อมูลสำหรับกราฟนี้ในช่วงที่เลือก';
      return;
    }
    const table=document.createElement('table'),caption=document.createElement('caption');
    table.className='srrt-dashboard-data-table';
    caption.textContent='ข้อมูลสรุปประกอบกราฟ';
    table.appendChild(caption);
    const thead=document.createElement('thead'),headRow=document.createElement('tr');
    for(const label of [String(arr[0][0]||'รายการ'),String(arr[0][1]||'จำนวน')]){
      const cell=document.createElement('th');cell.scope='col';cell.textContent=label;
      headRow.appendChild(cell);
    }
    thead.appendChild(headRow);table.appendChild(thead);
    const tbody=document.createElement('tbody');
    rows.forEach(item=>{
      const tr=document.createElement('tr'),name=document.createElement('th'),value=document.createElement('td');
      name.scope='row';name.textContent=item.label;value.textContent=String(item.value);
      tr.appendChild(name);tr.appendChild(value);tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    target.replaceChildren(table);
  }
  function draw(id,type,arr){
    const target=el(id);if(!target)return;
    const old=dashboardChartInstances.get(id);
    if(old){old.destroy();dashboardChartInstances.delete(id);}
    renderDashboardChartData(id,arr);
    // Identical sanitized values are consumed by Chart.js and the accessible data table.
    const rows=arr.slice(1).filter(row=>Array.isArray(row)&&row.length>=2&&
      Number.isFinite(Number(row[1]))&&Number(row[1])>=0)
      .map(row=>({label:String(row[0]??'-'),value:Number(row[1])}));
    if(!rows.length||!rows.some(row=>row.value>0)){
      const empty=document.createElement('p');empty.className='srrt-dashboard-chart-empty';
      empty.textContent='ไม่มีข้อมูลสำหรับกราฟนี้ในช่วงที่เลือก';
      target.replaceChildren(empty);return;
    }
    if(typeof Chart!=='function')throw new Error('Chart.js is unavailable');
    const canvas=document.createElement('canvas');
    canvas.setAttribute('aria-hidden','true');
    target.replaceChildren(canvas);
    const palette=['#0f766e','#2563eb','#b45309','#7c3aed','#be185d','#0284c7','#4d7c0f','#9a3412'];
    const primary=settings.PRIMARY_COLOR||palette[0];
    const secondary=settings.SECONDARY_COLOR||palette[1];
    const values=rows.map(row=>row.value),labels=rows.map(row=>row.label);
    const doughnut=type==='doughnut';
    const color=doughnut?rows.map((_,i)=>palette[i%palette.length]):type==='line'?secondary:primary;
    const total=values.reduce((sum,value)=>sum+value,0);
    const chart=new Chart(canvas,{
      type:type,
      data:{labels:labels,datasets:[{label:String(arr[0][1]||'จำนวน'),data:values,
        backgroundColor:doughnut?color:type==='line'?'rgba(37,99,235,.16)':color,
        borderColor:doughnut?'#ffffff':type==='line'?secondary:primary,
        borderWidth:doughnut?2:1,fill:type==='line',tension:type==='line'?.3:0,
        pointRadius:type==='line'?4:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        indexAxis:id==='barChart'?'y':'x',
        plugins:{legend:{display:doughnut,position:'bottom',
          labels:{boxWidth:12,font:{family:'Prompt, sans-serif',size:11}}},
          tooltip:{callbacks:{label:context=>{
            const value=Number(context.raw||0);
            return String(context.label||'')+': '+value.toLocaleString('th-TH')+
              (doughnut&&total>0?' / '+total.toLocaleString('th-TH')+' ('+
              (100*value/total).toFixed(1)+'%)':'');
          }}}},
        scales:doughnut?{}:{
          x:{beginAtZero:id==='barChart',
            ticks:{precision:0,font:{family:'Prompt, sans-serif'}}},
          y:{beginAtZero:id==='lineChart',
            ticks:{precision:id==='lineChart'?0:undefined,font:{family:'Prompt, sans-serif'}}}
        }
      }
    });
    dashboardChartInstances.set(id,chart);
  }
  function monthRows(){const m={};allData.forEach(r=>{if(r.col2){const k=r.col2.substring(0,7);m[k]=(m[k]||0)+1}});return[['เดือน','จำนวน'],...Object.keys(m).sort().map(k=>[k,m[k]])]}
</script>
