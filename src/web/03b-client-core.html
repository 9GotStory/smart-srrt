  function el(id){return document.getElementById(id)}
  function gs(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(err))[fn](...args))}
  // UX-R1/P9-01: opt-in, scoped loading foundation. Existing RPC/session/job
  // controllers remain authoritative; never globally intercept google.script.run.
  const uiPendingActions=new Map();
  const uiUnverifiedActionKeys=new Set();
  const uiActionStates=new Set(['idle','loading','ready','success','empty','error','unknown']);
  function uiSetSectionState(sectionId,statusId,state,message=''){
    if(!uiActionStates.has(state))throw new Error('Invalid UI action state');
    const region=sectionId?el(sectionId):null,status=statusId?el(statusId):null;
    if(region){
      region.setAttribute('aria-busy',String(state==='loading'));
      region.setAttribute('data-ui-state',state);
    }
    if(status){
      status.setAttribute('role','status');
      status.setAttribute('aria-live','polite');
      status.textContent=String(message||'');
      status.hidden=!message&&(state==='idle'||state==='ready');
    }
    return state;
  }
  function uiBeginAction(key,options={}){
    if(typeof key!=='string'||!key.trim())throw new Error('UI action key required');
    if(uiPendingActions.has(key)||uiUnverifiedActionKeys.has(key))return null; // pending or unverified action
    const button=options.button||options.buttonId&&el(options.buttonId)||null;
    const region=options.region||options.sectionId&&el(options.sectionId)||null;
    const status=options.status||options.statusId&&el(options.statusId)||null;
    // A second key must not claim the same interactive button or busy region.
    if(button&&button.disabled)return null;
    for(const owner of uiPendingActions.values()){
      if(button&&owner.button===button||region&&owner.region===region||status&&owner.status===status)return null;
    }
    const lease={
      key,button,region,status,
      originalMarkup:button?button.innerHTML:'',
      originalDisabled:button?!!button.disabled:false,
      pendingText:String(options.pendingText||'กำลังดำเนินการ...')
    };
    uiPendingActions.set(key,lease);
    if(button){
      button.disabled=true;
      button.setAttribute('aria-busy','true');
      button.textContent=lease.pendingText; // never interpret a status as HTML
    }
    if(region) {
      region.setAttribute('aria-busy','true');
      region.setAttribute('data-ui-state','loading');
    }
    if(status){
      status.setAttribute('role','status');
      status.setAttribute('aria-live','polite');
      status.textContent=lease.pendingText;
      status.hidden=false;
    }
    return lease;
  }
  function uiFinishAction(lease,state='ready',message='',options={}){
    if(!lease||uiPendingActions.get(lease.key)!==lease)return false;
    if(!uiActionStates.has(state)||state==='loading')throw new Error('Invalid terminal UI action state');
    uiPendingActions.delete(lease.key);
    if(state==='unknown')uiUnverifiedActionKeys.add(lease.key);
    const button=lease.button;
    if(button&&button.isConnected!==false){
      button.innerHTML=lease.originalMarkup;
      // Caller with changing permissions must supply an authoritative recheck.
      let canEnable=false;
      if(state!=='unknown'){
        try{canEnable=typeof options.canEnable==='function'
          ?!!options.canEnable():!lease.originalDisabled;}
        catch(_){canEnable=false;} // fail closed if an authorization recheck fails
      }
      button.disabled=!canEnable;
      button.setAttribute('aria-busy','false');
    }
    if(lease.region&&lease.region.isConnected!==false){
      lease.region.setAttribute('aria-busy','false');
      lease.region.setAttribute('data-ui-state',state);
    }
    if(lease.status&&lease.status.isConnected!==false){
      lease.status.setAttribute('role','status');
      lease.status.setAttribute('aria-live','polite');
      lease.status.textContent=String(message||'');
      lease.status.hidden=!message&&(state==='ready'||state==='idle');
    }
    return true;
  }
  function uiInvalidateAction(lease){
    // Old finally must never clear a successor's busy state or repaint its UI.
    return !!lease&&uiFinishAction(lease,'idle','');
  }
  function uiInvalidateAllActions(){
    for(const lease of [...uiPendingActions.values()])uiInvalidateAction(lease);
    // Unknown outcomes intentionally survive reset: verify the server first.
  }
  function uiConfirmActionResult(key){
    // Only call after a separately authenticated, authoritative status/read.
    // The caller must also re-render/re-enable the control using live policy.
    return uiUnverifiedActionKeys.delete(key);
  }
  function toast(msg){const t=el('toast');t.textContent=String(msg||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4200)}
  // UX-R1/P7-02: keyboard support only for non-destructive Admin forms + Auth.
  // Record, lifecycle and AI confirmation dialogs retain their specialized consent handlers.
  const keyboardDialogIds=['loginModal','userModal','masterDataModal','areaModal','contentModal'];
  const adminDialogKinds={userModal:'user',masterDataModal:'master',areaModal:'area',contentModal:'content'};
  const adminDialogOpeners=new Map();
  function clearAdminDialogFocusState(){adminDialogOpeners.clear()}
  function keyboardDialogControls(dialog){
    if(!dialog||typeof dialog.querySelectorAll!=='function')return [];
    return [...dialog.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')]
      .filter(control=>{
        if(!control||control.disabled||control.hidden||control.tabIndex<0)return false;
        if(typeof control.closest==='function'&&control.closest('[hidden], [aria-hidden="true"]'))return false;
        if(control.getAttribute&&control.getAttribute('aria-hidden')==='true')return false;
        if(control.style&&control.style.display==='none')return false;
        return typeof control.focus==='function'
      })
  }
  function openModal(id){
    const dialog=el(id);
    if(!dialog)return;
    if(Object.prototype.hasOwnProperty.call(adminDialogKinds,id))
      adminDialogOpeners.set(id,typeof document!=='undefined'?document.activeElement:null);
    dialog.classList.add('open');
    if(Object.prototype.hasOwnProperty.call(adminDialogKinds,id)){
      const first=keyboardDialogControls(dialog)[0];
      if(first)first.focus()
    }
  }
  function closeModal(id){
    const dialog=el(id);
    if(!dialog)return;
    dialog.classList.remove('open');
    if(Object.prototype.hasOwnProperty.call(adminDialogKinds,id)){
      const opener=adminDialogOpeners.get(id);
      adminDialogOpeners.delete(id);
      if(opener&&opener.isConnected!==false&&typeof opener.focus==='function')opener.focus()
    }
  }
  document.addEventListener('keydown',event=>{
    if(!['Tab','Escape'].includes(event.key))return;
    const active=keyboardDialogIds.map(id=>el(id))
      .filter(dialog=>dialog&&dialog.classList&&dialog.classList.contains('open'));
    if(!active.length)return;
    const dialog=active[active.length-1];
    // If a nested specialized confirmation is active, let its own code handle keys.
    if(typeof document.querySelectorAll==='function'){
      const open=[...document.querySelectorAll('.modal.open')];
      // Never override an open Record, Event or AI confirmation, regardless of DOM order.
      if(open.some(other=>!keyboardDialogIds.includes(other.id))||
         (open.length&&open[open.length-1]!==dialog))return
    }
    if(event.key==='Escape'){
      event.preventDefault();
      if(dialog.id==='loginModal'){
        if(typeof closeAuthDialog==='function')closeAuthDialog();
        return
      }
      const kind=adminDialogKinds[dialog.id];
      if(kind&&typeof adminFormSavePending!=='undefined'&&adminFormSavePending[kind])return;
      closeModal(dialog.id);
      return
    }
    const focusables=keyboardDialogControls(dialog);
    if(!focusables.length)return;
    const first=focusables[0],last=focusables[focusables.length-1],current=document.activeElement;
    if(event.shiftKey){
      if(current===first||!focusables.includes(current)){
        event.preventDefault();last.focus()
      }
    }else if(current===last||!focusables.includes(current)){
      event.preventDefault();first.focus()
    }
  });
  function toggleSidebar(show){
    const sidebar=el('sidebar'), trigger=el('openSidebarBtn');
    sidebar.classList.toggle('open',show);el('overlay').classList.toggle('show',show);
    if(trigger)trigger.setAttribute('aria-expanded',show?'true':'false');
    const mobile=typeof window!=='undefined' && typeof window.matchMedia==='function' && window.matchMedia('(max-width:980px)').matches;
    if(mobile && show){
      const active=sidebar.querySelector('.nav button.active');
      if(active)active.focus();
    }else if(mobile && !show && sidebar.contains(document.activeElement) && trigger){
      trigger.focus();
    }
  }
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && el('sidebar').classList.contains('open'))toggleSidebar(false);
  });
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function unique(arr){return [...new Set(arr.filter(v=>String(v||'').trim()!=='').map(v=>String(v).trim()))].sort((a,b)=>a.localeCompare(b,'th'))}
  function isInvestigationCriteriaMet(value){return String(value||'').trim()==='เข้าเกณฑ์'}
  function roleCanManage(){return currentUser&&['Super Admin','Manager'].includes(currentUser.role)}
  function roleCanRecord(){return currentUser&&['Super Admin','Manager','Admin'].includes(currentUser.role)}
