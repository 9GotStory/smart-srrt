<script>
  function reportReadinessBadge(r){
    const rd=r&&r.aiReportReadiness?r.aiReportReadiness:null;
    if(!rd)return'';
    if(rd.level==='ready')return'<span class="status st-low" title="ไม่พบคำเตือนจากการตรวจเบื้องต้น ไม่ใช่การรับรองความถูกต้องของข้อมูลหรือรายงาน AI"><i class="fa-solid fa-circle-check"></i> AI พร้อม</span>';
    const title=(rd.warnings||[]).map(w=>w.message||w.code).join('\n');
    if(rd.level==='limited')return`<span class="status st-high" title="${escapeHtml(title)}"><i class="fa-solid fa-triangle-exclamation"></i> AI ข้อมูลจำกัด ${Number(rd.warningCount||0)}</span>`;
    return`<span class="status st-mid" title="${escapeHtml(title)}"><i class="fa-solid fa-triangle-exclamation"></i> AI ตรวจสอบ ${Number(rd.warningCount||0)}</span>`
  }

  function eventLifecycleActions(r,i){
    const status=String(r&&r.recordStatus||'active').toLowerCase();
    const buttons=[];
    if(status!=='closed'&&roleCanRecord())buttons.push(`<button class="btn light" onclick="openRecordForm('edit',${i})">แก้ไข</button>`);
    if(roleCanManage()){
      if(status==='closed')buttons.push(`<button class="btn green" onclick='reopenEventFlow(${JSON.stringify(r.eventId||"")},${Number(r.revision||1)})'>เปิดใหม่</button>`);
      else buttons.push(`<button class="btn gray" onclick='closeEventFlow(${JSON.stringify(r.eventId||"")},${Number(r.revision||1)})'>ปิดเหตุการณ์</button>`);
      buttons.push(`<button class="btn red" onclick='deleteEvent(${JSON.stringify(r.eventId||"")},${Number(r.revision||1)})'>ยกเลิก</button>`);
    }
    return buttons.join(' ')||'-'
  }
  function closeEventFlow(eventId,revision){
    openEventActionDialog('close',eventId,revision)
  }
  function reopenEventFlow(eventId,revision){
    openEventActionDialog('reopen',eventId,revision)
  }

  // UX-R1/P4-01: filters operate on private, already authorized in-memory rows only.
  function updateRecordFilterOptions(){
    const box=el('recordDiseaseFilter'), selected=box.value;
    const groups=[...new Set(allData.map(r=>String(r.col5||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
    box.innerHTML='<option value="">ทุกกลุ่มโรค</option>'+groups.map(name=>'<option value="'+escapeHtml(name)+'">'+escapeHtml(name)+'</option>').join('');
    box.value=groups.includes(selected)?selected:'';
  }
  function filteredRecordEntries(){
    if(!currentUser)return [];
    const search=String(el('recordSearch').value||'').trim().toLocaleLowerCase('th');
    const status=String(el('recordStatusFilter').value||'');
    const disease=String(el('recordDiseaseFilter').value||'');
    return allData.map((r,i)=>({r,i})).filter(({r})=>{
      if(status&&String(r.recordStatus||'active').toLowerCase()!==status)return false;
      if(disease&&String(r.col5||'').trim()!==disease)return false;
      if(!search)return true;
      const content=[r.col2,r.col5,r.col6,r.col10,r.col11,r.col12,r.col13,
        r.col14,r.col27,r.col29,r.col30,r.ownerName,r.ownerOrg].map(v=>String(v||'')).join(' ').toLocaleLowerCase('th');
      return content.includes(search);
    })
  }
  function clearRecordFilters(){
    for(const id of ['recordSearch','recordStatusFilter','recordDiseaseFilter'])el(id).value='';
    el('recordDiseaseFilter').innerHTML='<option value="">ทุกกลุ่มโรค</option>';
    el('recordResultSummary').textContent='';
  }
  function resetRecordFilters(){
    for(const id of ['recordSearch','recordStatusFilter','recordDiseaseFilter'])el(id).value='';
    renderTables();
  }

  function renderTables(){
    if(!currentUser){el('eventBody').innerHTML='';el('recordBody').innerHTML='';el('reportBody').innerHTML='';clearRecordFilters();return}
    const manage=roleCanRecord();
    updateRecordFilterOptions();
    const visibleRecords=filteredRecordEntries();
    el('recordResultSummary').textContent='แสดง '+visibleRecords.length+' จาก '+allData.length+' เหตุการณ์';
    el('eventBody').innerHTML=allData.map((r,i)=>{
      const closed=String(r.recordStatus||'active').toLowerCase()==='closed';
      const ownerControl=roleCanManage()&&!closed?`<div style="margin-top:6px"><button class="btn light" onclick="openOwnerModal(${i})">กำหนด</button></div>`:'';
      const primary=manage&&!closed?`<button class="btn light" onclick="openRecordForm('edit',${i})">แก้ไข</button> `:'';
      return`<tr><td>${escapeHtml(r.col2)}</td><td><b style="color:#b91c1c">${escapeHtml(r.col6||'-')}</b></td><td>${escapeHtml(locationLabel(r))}</td><td>${lifecycleBadge(r)}${consistencyWarningBadge(r)}</td><td>${ownerLabel(r)}${ownerControl}</td><td>${escapeHtml(r.col15||'-')}</td><td>${escapeHtml(r.col17||'-')}</td><td>${riskBadge(r.col19)}</td><td>${attachmentButton(r,i)}</td><td>${manage?`${primary}${reportActionButton(r.eventId||'',true)} ${reportReadinessBadge(r)}`:'-'}</td></tr>`
    }).join('')||'<tr><td colspan="10">ไม่มีข้อมูล</td></tr>';
    el('recordBody').innerHTML=visibleRecords.map(({r,i})=>{
      const closed=String(r.recordStatus||'active').toLowerCase()==='closed';
      const ownerControl=roleCanManage()&&!closed?`<div style="margin-top:6px"><button class="btn light" onclick="openOwnerModal(${i})">กำหนด</button></div>`:'';
      return`<tr class="srrt-record-row"><td data-label="วันรับแจ้ง">${escapeHtml(r.col2)}</td><td data-label="โรค/เหตุการณ์">${escapeHtml(r.col6||'-')}</td><td data-label="หมู่บ้าน/พื้นที่">${escapeHtml(locationLabel(r))}</td><td data-label="สถานะเหตุการณ์">${lifecycleBadge(r)}${consistencyWarningBadge(r)}</td><td data-label="การตรวจสอบ">${escapeHtml(r.col15||'-')}</td><td data-label="เข้าเกณฑ์สอบสวน">${escapeHtml(r.col17||'-')}</td><td data-label="การสอบสวน">${escapeHtml(r.col24||'-')} ${escapeHtml(r.col26||'')}</td><td data-label="ความเสี่ยง">${riskBadge(r.col19)}</td><td data-label="ผู้รับผิดชอบ">${ownerLabel(r)}${ownerControl}</td><td data-label="ผู้บันทึก">${escapeHtml(r.col27||'-')}</td><td data-label="ไฟล์แนบ">${attachmentButton(r,i)}</td><td data-label="จัดการ">${eventLifecycleActions(r,i)}</td></tr>`
    }).join('')||'<tr class="srrt-record-empty"><td colspan="12">'+(allData.length?'ไม่พบรายการที่ตรงกับเงื่อนไขค้นหา':'ยังไม่มีข้อมูลเหตุการณ์')+'</td></tr>';
    el('reportBody').innerHTML=allData.map((r,i)=>`<tr><td>${escapeHtml(r.col2)}</td><td>${escapeHtml(r.col6||'-')}</td><td>${escapeHtml(locationLabel(r))}</td><td style="white-space:normal;max-width:420px">${escapeHtml(r.col14||'-')}</td><td>${manage?`${reportActionButton(r.eventId||'',false)} ${reportReadinessBadge(r)}`:'-'}</td></tr>`).join('')||'<tr><td colspan="5">ไม่มีข้อมูล</td></tr>'
  }


  // P4-02: group presentation only; colN persistence and server-side rules remain unchanged.
  const recordFieldGroups=[
    {id:'receive',title:'1. รับแจ้งและจำแนกเหตุการณ์',keys:[2,3,4,5,6,7]},
    {id:'place',title:'2. เวลาและสถานที่เกิดเหตุ',keys:[9,8,13,12,11,10,29,30]},
    {id:'verify',title:'3. รายละเอียด การตรวจสอบ และความเสี่ยง',keys:[14,15,16,17,19,20,23]},
    {id:'investigate',title:'4. การสอบสวนและมาตรการ',keys:[18,24,26,21,22]}
  ];
  let recordDraftSnapshot='',recordSaveInFlight=false;
  function recordDraftValues(){
    return JSON.stringify(fields.map(f=>String(el('in'+f[0]).value||'')));
  }
  function recordDraftChanged(){
    return recordDraftValues()!==recordDraftSnapshot;
  }
  function updateRecordDraftState(){
    const status=el('recordDraftStatus');
    if(status)status.textContent=recordDraftChanged()?'มีข้อมูลแก้ไขที่ยังไม่บันทึก':'ยังไม่มีการเปลี่ยนแปลง';
    const review=el('recordReviewSummary');
    if(review)review.textContent='ตรวจทานข้อมูลทั้งหมด '+fields.length+' รายการก่อนบันทึก ข้อมูลที่ไม่กรอกจะคงเป็นค่าว่างตามกฎเดิมของระบบ';
  }
  function cancelRecordForm(){
    if(recordSaveInFlight)return;
    if(recordDraftChanged()&&!confirm('ข้อมูลที่แก้ไขยังไม่ได้บันทึก ต้องการยกเลิกและทิ้งการเปลี่ยนแปลงหรือไม่?'))return;
    closeModal('recordModal');
    recordDraftSnapshot='';
  }
  function discardRecordFormOnLogout(){
    if(typeof fields!=='undefined'&&Array.isArray(fields))fields.forEach(f=>{const control=el('in'+f[0]);if(control)control.value=''});
    recordDraftSnapshot='';
    // A pending response is still guarded by the original session token below.
    closeModal('recordModal');
    const status=el('recordDraftStatus');if(status)status.textContent='';
  }
  function buildRecordForm(){
    const inputs=new Map(fields.map(f=>{
      const span=f[2]==='textarea'?' span-3':'',id='in'+f[0];let input='';
      if(f[2]==='textarea')input=`<textarea id="${id}" rows="3"></textarea>`;
      else if(f[2]==='date')input=`<input type="date" id="${id}">`;
      else if(f[2].startsWith('select:')){const key=f[2].split(':')[1];input=`<select id="${id}"><option value="">-- เลือก --</option>${(master[key]||[]).map(o=>`<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}</select>`}
      else if(f[2].startsWith('select_custom:')){const opts=f[2].split(':')[1].split('|');input=`<select id="${id}"><option value="">-- เลือก --</option>${opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('')}</select>`}
      else if(f[2].startsWith('area:'))input=`<input type="text" id="${id}" list="${id}List" onchange="onRecordAreaChange(${f[0]})"><datalist id="${id}List"></datalist>`;
      else input=`<input type="text" id="${id}">`;
      return[f[0],`<div class="fg${span}"><label for="${id}">${escapeHtml(f[1])}</label>${input}</div>`]
    }));
    const controlByKey=new Map(inputs);
    const keys=recordFieldGroups.flatMap(group=>group.keys);
    if(keys.length!==fields.length||new Set(keys).size!==fields.length||
       keys.some(key=>!controlByKey.has(key)))throw Error('P4-02 record field group mapping mismatch');
    el('recordForm').innerHTML=recordFieldGroups.map(group=>
      `<section class="srrt-record-section" id="record-group-${group.id}" aria-labelledby="record-heading-${group.id}"><h3 id="record-heading-${group.id}">${group.title}</h3><div class="form-grid">${group.keys.map(key=>controlByKey.get(key)).join('')}</div></section>`
    ).join('')+
      '<section class="srrt-record-section srrt-record-review" id="record-group-review" aria-labelledby="record-heading-review"><h3 id="record-heading-review">5. ตรวจทานก่อนบันทึก</h3><p id="recordReviewSummary" class="help"></p></section>';
    refreshRecordAreaOptions();
    recordDraftSnapshot=recordDraftValues();
    updateRecordDraftState();
  }
  function refreshRecordAreaOptions(){
    if(!el('in13'))return;
    const p=el('in13').value,a=el('in12').value,t=el('in11').value;
    const filtered=areas.filter(x=>(!p||x.province===p)&&(!a||x.amphoe===a)&&(!t||x.tambon===t));
    setDatalist('in13List',unique(areas.map(x=>x.province)));setDatalist('in12List',unique(areas.filter(x=>!p||x.province===p).map(x=>x.amphoe)));
    setDatalist('in11List',unique(areas.filter(x=>(!p||x.province===p)&&(!a||x.amphoe===a)).map(x=>x.tambon)));
    setDatalist('in10List',unique(filtered.map(x=>x.moo)));setDatalist('in29List',unique(filtered.map(x=>x.village)))
  }
  function setDatalist(id,values){el(id).innerHTML=values.map(v=>`<option value="${escapeHtml(v)}"></option>`).join('')}
  function onRecordAreaChange(col){
    refreshRecordAreaOptions();
    if(col===29){
      const v=el('in29').value,p=el('in13').value,a=el('in12').value,t=el('in11').value;
      const found=areas.find(x=>x.village===v&&(!p||x.province===p)&&(!a||x.amphoe===a)&&(!t||x.tambon===t));
      if(found){el('in13').value=found.province;el('in12').value=found.amphoe;el('in11').value=found.tambon;el('in10').value=found.moo;el('in30').value=found.villageCode||''}
    }
  }
  function toIso(thai){if(!thai)return'';const p=String(thai).split('-');if(p.length!==3)return thai;let y=+p[0];if(y>2400)y-=543;return`${y}-${p[1]}-${p[2]}`}
  function toThai(iso){if(!iso)return'';const p=String(iso).split('-');if(p.length!==3)return iso;return`${+p[0]+543}-${p[1]}-${p[2]}`}
  function openRecordForm(mode,i){
    if(!roleCanRecord()){openLogin();return}
    el('formMode').value=mode;el('recordTitle').textContent=mode==='add'?'เพิ่มข้อมูลเหตุการณ์ใหม่':'แก้ไขข้อมูลเหตุการณ์';
    el('editEventId').value='';el('editRevision').value='';
    fields.forEach(f=>{const x=el('in'+f[0]);if(x)x.value=''});
    if(mode==='edit'){
      const r=allData[i];
      if(!r.eventId){toast('ข้อมูลเหตุการณ์ยังไม่มี EventID กรุณาให้ผู้ดูแลอัปเกรดโครงสร้างข้อมูลก่อน');return}
      if(String(r.recordStatus||'active').toLowerCase()==='closed'){toast('เหตุการณ์นี้ถูกปิดแล้ว กรุณาเปิดเหตุการณ์อีกครั้งก่อนแก้ไขข้อมูล');return}
      el('editEventId').value=r.eventId;el('editRevision').value=String(r.revision||1);
      fields.forEach(f=>{
        const x=el('in'+f[0]);if(!x)return;
        const v=r['col'+f[0]]||'';
        if(f[2].startsWith('select:')&&v&&!Array.from(x.options).some(o=>o.value===String(v))){
          const legacy=document.createElement('option');legacy.value=String(v);legacy.textContent='[เลิกใช้งาน] '+String(v);legacy.dataset.legacy='true';x.appendChild(legacy)
        }
        x.value=f[2]==='date'?toIso(v):v
      })
    }
    refreshRecordAreaOptions();recordDraftSnapshot=recordDraftValues();updateRecordDraftState();openModal('recordModal')
  }

  async function saveRecord(){
    if(recordSaveInFlight||!roleCanRecord())return;
    const btn=el('saveRecordBtn'),cancel=el('cancelRecordBtn');
    const sessionToken=token;
    recordSaveInFlight=true;
    try{
      btn.disabled=true;cancel.disabled=true;
      btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก';
      const data={};fields.forEach(f=>{const x=el('in'+f[0]);data['col'+f[0]]=f[2]==='date'?toThai(x.value):x.value});
      const msg=el('formMode').value==='add'
        ?await gs('addRecord',token,data)
        :await gs('updateRecord',token,el('editEventId').value,data,Number(el('editRevision').value||0));
      if(token!==sessionToken||!currentUser)return;
      recordDraftSnapshot=recordDraftValues();
      closeModal('recordModal');toast(msg);await loadDashboard()
    }catch(e){
      if(token===sessionToken&&currentUser)toast('บันทึกไม่สำเร็จ: '+(e.message||e));
    }finally{
      recordSaveInFlight=false;btn.disabled=false;cancel.disabled=false;
      btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> บันทึก';
    }
  }
  function deleteEvent(eventId,revision){
    openEventActionDialog('void',eventId,revision)
  }
</script>
