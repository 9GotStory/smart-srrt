name: tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deterministic One-Click build parity
        run: npm run build:check
      - name: Verify syntax, RPC and duplicate declarations
        run: npm run check:contracts
      - name: Run complete regression tests
        run: npm test
