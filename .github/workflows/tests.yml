name: tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated Tailwind CSS (read-only)
        run: npm run check:ui-assets
      - name: Verify deterministic One-Click build parity
        run: npm run build:check
      - name: Build and verify native Apps Script multi-file package (offline)
        run: |
          npm run build:gas-multifile
          npm run check:gas-multifile
      - name: Verify syntax, RPC and duplicate declarations
        run: npm run check:contracts
      - name: Verify offline P6 release readiness without deployment
        run: npm run release:preflight
      - name: Run complete regression tests
        run: npm test
