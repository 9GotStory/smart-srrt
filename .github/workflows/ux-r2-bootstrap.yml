name: UX-R2 bootstrap fixture generator (TEMPORARY)

# Temporary, read-only, branch-scoped job. Remove before PR merge.
# Rerun after fixture drift assertion correction.
# Print raw base64 only for verified lockfile and synthetic CSS; removed before PR.
on:
  push:
    branches:
      - feat/ux-r2-01-build-foundation
    paths:
      - .github/workflows/ux-r2-bootstrap.yml

permissions:
  contents: read

jobs:
  lock-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible lockfile and CSS in disposable checkout
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:ui-assets
          node tools/build-one-click.mjs --write
          node --test tests/ux-r2-ui-assets.test.mjs
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"
          echo "STYLE_BASE64_BEGIN"
          base64 -w0 src/web/01-styles.html
          echo
          echo "STYLE_BASE64_END"
          echo "SOURCE_SHA256_SUMS"
          sha256sum package-lock.json src/web/01-styles.html Index_Smart_SRRT_OneClick.html
